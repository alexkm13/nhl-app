services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20

  ingestor:
    build: ./services/ingestor
    environment:
      - REDIS_URL=redis://redis:6379/0
      - GAME_ID=2025020161
    depends_on:
      redis:
        condition: service_healthy

  feature_state:
    build:
      context: .
      dockerfile: services/feature_state/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  model_svc:
    build:
      context: .
      dockerfile: services/model_svc/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MODEL_ID=lightgbm_20251104_121934_d9b5b03f
      - DATABASE_URL=postgresql://postgres:postgres@timescaledb:5432/gamecast
      # A/B testing configuration (disabled by default)
      # - AB_TEST_ENABLED=true
      # - AB_TEST_CONFIG='{"variants": [{"model_id": "lightgbm_20251104_121934_d9b5b03f", "name": "improved", "traffic_percentage": 50, "enabled": true}, {"model_id": "lightgbm_20251104_115151_e21578a7", "name": "previous", "traffic_percentage": 50, "enabled": true}]}'
    volumes:
      # Mount training models directory so model_svc can access trained models
      - ./services/training/models:/app/models:ro
      - ./services/training/experiments:/app/experiments:ro
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:postgres@timescaledb:5432/gamecast
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    ports:
      - "8000:8000"

  gateway-test:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:postgres@timescaledb:5432/gamecast
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    command: ["pytest", "tests/", "-v"]
    profiles:
      - test

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      - POSTGRES_DB=gamecast
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./infra/timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gamecast"]
      interval: 5s
      timeout: 5s
      retries: 20

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - gateway
      - model_svc

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  timescaledb-data:
