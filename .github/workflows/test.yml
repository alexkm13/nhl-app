name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -r services/gateway/requirements.txt
    
    - name: Lint with ruff
      run: |
        ruff check services/
        ruff format --check services/
    
    - name: Run tests
      run: |
        # Only run tests if test directories exist
        if [ -d "services/gateway/tests" ] || [ -d "tests" ]; then
          pytest services/gateway/tests/ tests/ -v --cov=services --cov-report=xml
        else
          echo "No test directories found, skipping tests"
          # Create empty coverage file to satisfy upload step
          echo '<?xml version="1.0"?><coverage></coverage>' > coverage.xml
        fi
    
    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

