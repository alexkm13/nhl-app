global:
  scrape_interval: 5s
  evaluation_interval: 10s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8000"]
    metrics_path: /metrics

  - job_name: model_svc
    static_configs:
      - targets: ["model_svc:9000"]

  # You can add feature_state and ingestor later
