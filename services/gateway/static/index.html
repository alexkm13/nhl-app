<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHL GameCast</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            min-height: 100vh;
            padding: 0;
        }

        .header {
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
            padding: 20px 40px;
        }

        .header h1 {
            font-size: 1.8em;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .date-selector {
            display: flex;
            gap: 30px;
            padding: 20px 40px;
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
            overflow-x: auto;
        }

        .date-item {
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .date-item:hover {
            opacity: 0.8;
        }

        .date-item .date-top {
            font-size: 0.85em;
            font-weight: 500;
            color: #aaaaaa;
            margin-bottom: 4px;
        }

        .date-item .date-bottom {
            font-size: 1.2em;
            font-weight: 700;
            color: #aaaaaa;
        }

        .date-item.active .date-top {
            color: #ff4d6d;
        }

        .date-item.active .date-bottom {
            color: #ff4d6d;
            font-size: 1.3em;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section {
            background: #1a1a1a;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 1.2em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section-header.games {
            color: #ffffff;
        }

        .section-header.standings {
            color: #ff4d6d;
        }

        .section-header.standings::after {
            content: '→';
            margin-left: 10px;
            font-size: 1em;
        }

        .games-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .game-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.2s;
            cursor: pointer;
        }

        .game-card:hover {
            border-color: #3a3a3a;
            background: #222222;
        }

        .game-row {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            gap: 15px;
        }

        .team-logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: contain;
            flex-shrink: 0;
        }

        .team-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .team-record {
            font-size: 1.1em;
            font-weight: 700;
            color: #ffffff;
        }

        .team-name {
            font-size: 0.9em;
            color: #ff4d6d;
        }

        .team-name.away {
            color: #aaaaaa;
        }

        .game-time-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .game-time {
            font-size: 1em;
            font-weight: 700;
            color: #ffffff;
        }

        .game-channel {
            font-size: 0.8em;
            color: #aaaaaa;
        }

        .game-status {
            font-size: 0.8em;
            color: #aaaaaa;
            margin-top: 4px;
        }

        .standings-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .standing-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .standing-item:hover {
            background: #222222;
        }

        .standing-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: contain;
        }

        .standing-record {
            font-size: 1em;
            font-weight: 700;
            color: #ffffff;
            min-width: 60px;
        }

        .standing-name {
            font-size: 0.9em;
            color: #aaaaaa;
        }

        .game-details {
            margin-top: 30px;
            padding: 30px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            display: none;
        }

        .game-details.show {
            display: block;
        }

        .input-section {
            padding: 30px 40px;
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
        }

        .input-group {
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }

        .input-field {
            flex: 1;
        }

        .input-field label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9em;
            font-weight: 600;
            color: #aaaaaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-field input {
            width: 100%;
            padding: 12px 16px;
            background: #222222;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1em;
            transition: border-color 0.2s;
        }

        .input-field input:focus {
            outline: none;
            border-color: #ff4d6d;
        }

        button {
            background: #ff4d6d;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover:not(:disabled) {
            background: #ff6d8d;
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            margin-top: 15px;
            padding: 12px 16px;
            border-radius: 6px;
            display: none;
            font-size: 0.9em;
        }

        .status.info {
            background: #2a4a6a;
            color: #88ccee;
            border-left: 3px solid #88ccee;
        }

        .status.success {
            background: #2a4a2a;
            color: #88ee88;
            border-left: 3px solid #88ee88;
        }

        .status.error {
            background: #4a2a2a;
            color: #ee8888;
            border-left: 3px solid #ee8888;
        }

        .spinner {
            border: 3px solid #2a2a2a;
            border-top: 3px solid #ff4d6d;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .score-display {
            font-size: 2.5em;
            font-weight: 700;
            text-align: center;
            margin: 20px 0;
            color: #ffffff;
        }

        .win-prob {
            margin-top: 20px;
            padding: 20px;
            background: #222222;
            border-radius: 8px;
        }

        .win-prob-title {
            font-size: 1em;
            font-weight: 600;
            margin-bottom: 15px;
            color: #aaaaaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .win-prob-bar {
            margin-bottom: 15px;
        }

        .win-prob-bar-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9em;
            font-weight: 600;
            color: #ffffff;
        }

        .win-prob-bar-fill {
            height: 28px;
            background: #2a2a2a;
            border-radius: 6px;
            overflow: hidden;
        }

        .win-prob-bar-progress {
            height: 100%;
            background: #ff4d6d;
            transition: width 0.5s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.9em;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            border-bottom: 1px solid #2a2a2a;
        }

        .tab {
            padding: 12px 20px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 1em;
            font-weight: 600;
            color: #aaaaaa;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tab.active {
            color: #ff4d6d;
            border-bottom-color: #ff4d6d;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .playbyplay-feed {
            max-height: 500px;
            overflow-y: auto;
            background: #1a1a1a;
            border-radius: 8px;
            padding: 15px;
        }

        .playbyplay-event {
            display: flex;
            padding: 12px;
            border-bottom: 1px solid #2a2a2a;
            color: #ffffff;
            transition: background 0.2s;
        }

        .playbyplay-event:hover {
            background: #222222;
        }

        .playbyplay-event:last-child {
            border-bottom: none;
        }

        .event-player-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            margin-right: 12px;
            flex-shrink: 0;
            color: #ff4d6d;
        }

        .event-content {
            flex: 1;
        }

        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.85em;
            color: #aaaaaa;
        }

        .event-description {
            font-size: 0.95em;
            font-weight: 600;
            margin-bottom: 4px;
            color: #ffffff;
        }

        .event-player {
            font-size: 0.85em;
            color: #aaaaaa;
        }

        .event-strength {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75em;
            margin-left: 6px;
            background: #2a2a2a;
            color: #aaaaaa;
        }

        .footer {
            padding: 20px 40px;
            background: #1a1a1a;
            border-top: 1px solid #2a2a2a;
            color: #aaaaaa;
            font-size: 0.85em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .footer-check {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #88ee88;
            font-size: 10px;
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>NHL</h1>
    </div>

    <div class="date-selector" id="dateSelector">
        <!-- Dates will be populated by JavaScript -->
    </div>

    <div class="input-section">
        <div class="input-group">
            <div class="input-field">
                <label for="gameId">Game ID</label>
                <input type="text" id="gameId" placeholder="Enter game ID (e.g., 2025020011)" />
            </div>
            <button id="startBtn" onclick="startIngestion()">Start Analysis</button>
        </div>
        <div id="status" class="status"></div>
        <div id="loading" class="spinner" style="display: none;"></div>
    </div>

    <div class="main-container">
        <div class="section">
            <div class="section-header games">Games</div>
            <div class="games-list" id="gamesList">
                <div class="spinner"></div>
            </div>
        </div>

        <div class="section">
            <div class="section-header standings">Standings</div>
            <div class="standings-list" id="standingsList">
                <div style="color: #aaaaaa; padding: 20px; text-align: center;">Standings coming soon</div>
            </div>
        </div>
    </div>

    <div class="game-details" id="gameDetails"></div>

    <div class="footer">
        <div class="footer-check">✓</div>
        <span>Official NHL Data</span>
    </div>

    <script>
        const API_BASE = window.location.origin || 'http://localhost:8000';

        // Initialize date selector
        function initDateSelector() {
            const dateSelector = document.getElementById('dateSelector');
            const today = new Date();
            const dates = [];
            
            for (let i = -2; i <= 2; i++) {
                const date = new Date(today);
                date.setDate(today.getDate() + i);
                dates.push(date);
            }

            dates.forEach((date, index) => {
                const dateItem = document.createElement('div');
                dateItem.className = 'date-item';
                
                const month = date.toLocaleDateString('en-US', { month: 'short' });
                const day = date.getDate();
                const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
                
                const dateTop = document.createElement('div');
                dateTop.className = 'date-top';
                dateTop.textContent = `${month} ${day}`;
                
                const dateBottom = document.createElement('div');
                dateBottom.className = 'date-bottom';
                dateBottom.textContent = dayName;
                
                dateItem.appendChild(dateTop);
                dateItem.appendChild(dateBottom);
                
                dateItem.onclick = () => {
                    document.querySelectorAll('.date-item').forEach(item => item.classList.remove('active'));
                    dateItem.classList.add('active');
                    loadGamesList(date);
                };
                
                if (index === 2) {
                    dateItem.classList.add('active');
                }
                
                dateSelector.appendChild(dateItem);
            });
        }

        // Load games list
        async function loadGamesList(date = null) {
            const gamesList = document.getElementById('gamesList');
            gamesList.innerHTML = '<div class="spinner"></div>';

            try {
                let url = `${API_BASE}/v1/games`;
                if (date) {
                    const dateStr = date.toISOString().split('T')[0];
                    url += `?date=${dateStr}`;
                }

                const response = await fetch(url);
                const data = await response.json();

                if (response.ok && data.games && data.games.length > 0) {
                    gamesList.innerHTML = data.games.map(game => `
                        <div class="game-card" onclick="selectGame('${game.game_id}')">
                            <div class="game-row">
                                <img src="${game.away_team_logo || ''}" alt="${game.away_team_name}" class="team-logo" onerror="this.style.display='none'">
                                <div class="team-info">
                                    <div class="team-record">${game.away_score || '0'}-${game.home_score || '0'}</div>
                                    <div class="team-name away">${game.away_team_name || game.away_team}</div>
                                </div>
                                <div class="game-time-info">
                                    <div class="game-time">${game.game_time || 'TBD'}</div>
                                    <div class="game-channel">${game.venue || ''}</div>
                                    <div class="game-status">${game.game_state || 'FUT'}</div>
                                </div>
                            </div>
                            <div class="game-row">
                                <img src="${game.home_team_logo || ''}" alt="${game.home_team_name}" class="team-logo" onerror="this.style.display='none'">
                                <div class="team-info">
                                    <div class="team-record">${game.home_score || '0'}-${game.away_score || '0'}</div>
                                    <div class="team-name">${game.home_team_name || game.home_team}</div>
                                </div>
                                <div class="game-time-info">
                                    <div class="game-time"></div>
                                    <div class="game-channel"></div>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    gamesList.innerHTML = '<div style="color: #aaaaaa; padding: 20px; text-align: center;">No games scheduled for this date</div>';
                }
            } catch (error) {
                console.error('Error loading games:', error);
                gamesList.innerHTML = '<div style="color: #ee8888; padding: 20px; text-align: center;">Error loading games</div>';
            }
        }

        function selectGame(gameId) {
            document.getElementById('gameId').value = gameId;
            startIngestion();
        }

        async function startIngestion() {
            const gameId = document.getElementById('gameId').value.trim();
            if (!gameId) {
                showStatus('Please enter a game ID', 'error');
                return;
            }

            const startBtn = document.getElementById('startBtn');
            const status = document.getElementById('status');
            const loading = document.getElementById('loading');
            const gameDetails = document.getElementById('gameDetails');

            startBtn.disabled = true;
            gameDetails.style.display = 'none';
            loading.style.display = 'block';
            showStatus('Starting ingestion...', 'info');

            try {
                const response = await fetch(`${API_BASE}/v1/games/${gameId}/start`, {
                    method: 'POST'
                });
                const data = await response.json();

                if (response.ok) {
                    showStatus(`${data.message}. Processing game data...`, 'success');
                    pollForResults(gameId);
                } else {
                    showStatus(`Error: ${data.detail || 'Unknown error'}`, 'error');
                    loading.style.display = 'none';
                    startBtn.disabled = false;
                }
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
                loading.style.display = 'none';
                startBtn.disabled = false;
            }
        }

        async function pollForResults(gameId) {
            const loading = document.getElementById('loading');
            loading.style.display = 'block';

            try {
                const statusResponse = await fetch(`${API_BASE}/v1/games/${gameId}/status`);
                
                if (!statusResponse.ok) {
                    throw new Error(`HTTP ${statusResponse.status}: ${statusResponse.statusText}`);
                }
                
                let statusData;
                try {
                    statusData = await statusResponse.json();
                } catch (jsonError) {
                    const text = await statusResponse.text();
                    throw new Error(`Invalid JSON response: ${text.substring(0, 100)}`);
                }

                if (statusData.has_prediction) {
                    await fetchResults(gameId);
                    return;
                }

                if (statusData.ingestion_status === 'in_progress') {
                    showStatus('Ingestion in progress. Waiting for results...', 'info');
                    setTimeout(() => pollForResults(gameId), 5000);
                    return;
                }

                if (statusData.ingestion_status === 'failed') {
                    showStatus(`Ingestion failed: ${statusData.error || 'Unknown error'}`, 'error');
                    loading.style.display = 'none';
                    document.getElementById('startBtn').disabled = false;
                    return;
                }

                showStatus('Processing... Please wait', 'info');
                setTimeout(() => pollForResults(gameId), 5000);
            } catch (error) {
                console.error('Status check error:', error);
                const errorMsg = error.message || 'Network error';
                showStatus(`Error checking status: ${errorMsg}`, 'error');
                loading.style.display = 'none';
                document.getElementById('startBtn').disabled = false;
            }
        }

        async function fetchResults(gameId) {
            const loading = document.getElementById('loading');
            const gameDetails = document.getElementById('gameDetails');
            const startBtn = document.getElementById('startBtn');

            try {
                const response = await fetch(`${API_BASE}/v1/games/${gameId}/winprob/friendly`);
                const data = await response.json();

                if (response.ok) {
                    displayResults(data);
                    loading.style.display = 'none';
                    startBtn.disabled = false;
                    showStatus('Results loaded successfully!', 'success');
                } else if (response.status === 202) {
                    showStatus(data.detail, 'info');
                    setTimeout(() => pollForResults(gameId), 5000);
                } else {
                    showStatus(`${data.detail || 'Error fetching results'}`, 'error');
                    loading.style.display = 'none';
                    startBtn.disabled = false;
                }
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
                loading.style.display = 'none';
                startBtn.disabled = false;
            }
        }

        function displayResults(data) {
            const gameDetails = document.getElementById('gameDetails');
            const game = data.game;
            const score = data.score;
            const situation = data.current_situation;
            const winProb = data.win_probability;

            const homeTeam = score.home.team;
            const awayTeam = score.away.team;
            const homeScore = score.home.goals;
            const awayScore = score.away.goals;

            const homeProb = winProb[homeTeam];
            const awayProb = winProb[awayTeam];

            const gameId = data.game.id;
            
            gameDetails.innerHTML = `
                <div style="margin-bottom: 20px;">
                    <div style="font-size: 1.5em; font-weight: 700; margin-bottom: 10px;">${game.matchup}</div>
                    <div style="color: #aaaaaa; font-size: 0.9em;">${game.favorite}</div>
                </div>

                <div class="score-display">${homeScore} - ${awayScore}</div>

                <div class="tabs">
                    <button class="tab active" onclick="switchTab('overview', '${gameId}')">Overview</button>
                    <button class="tab" onclick="switchTab('playbyplay', '${gameId}')">Play-by-Play</button>
                </div>

                <div id="overview-tab" class="tab-content active">
                    <div style="padding: 20px; background: #222222; border-radius: 8px; margin-bottom: 20px;">
                        <div style="font-size: 0.9em; color: #aaaaaa; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">Current Situation</div>
                        <div style="font-size: 1.1em; font-weight: 600; margin-bottom: 8px;">${situation.strength}${situation.empty_net && !situation.strength.toLowerCase().includes('empty net') ? ' Empty Net' : ''}</div>
                        <div style="font-size: 0.9em; color: #aaaaaa; margin-top: 8px;">
                            Last Event: ${situation.last_event}${situation.last_player ? ` by ${situation.last_player}` : ''}
                        </div>
                    </div>

                    <div class="win-prob">
                        <div class="win-prob-title">Win Probability</div>
                        <div class="win-prob-bar">
                            <div class="win-prob-bar-label">
                                <span>${homeTeam}</span>
                                <span>${homeProb}%</span>
                            </div>
                            <div class="win-prob-bar-fill">
                                <div class="win-prob-bar-progress" style="width: ${homeProb}%">${homeProb}%</div>
                            </div>
                        </div>
                        <div class="win-prob-bar">
                            <div class="win-prob-bar-label">
                                <span>${awayTeam}</span>
                                <span>${awayProb}%</span>
                            </div>
                            <div class="win-prob-bar-fill">
                                <div class="win-prob-bar-progress" style="width: ${awayProb}%">${awayProb}%</div>
                            </div>
                        </div>
                        <div style="text-align: center; margin-top: 15px; padding-top: 15px; border-top: 1px solid #2a2a2a;">
                            <div style="font-size: 0.9em; color: #aaaaaa; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px;">Confidence</div>
                            <div style="font-size: 1.2em; font-weight: 600;">${data.confidence}</div>
                        </div>
                    </div>
                </div>

                <div id="playbyplay-tab" class="tab-content">
                    <div id="playbyplay-feed" class="playbyplay-feed">
                        <div class="spinner"></div>
                    </div>
                </div>
            `;
            
            loadPlayByPlay(gameId, homeTeam, awayTeam);
            gameDetails.style.display = 'block';
            gameDetails.classList.add('show');
            gameDetails.scrollIntoView({ behavior: 'smooth' });
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }

        function switchTab(tabName, gameId) {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            event.target.classList.add('active');
            document.getElementById(`${tabName}-tab`).classList.add('active');

            if (tabName === 'playbyplay') {
                const feed = document.getElementById('playbyplay-feed');
                if (feed && (!feed.innerHTML.trim() || feed.innerHTML.includes('spinner'))) {
                    loadPlayByPlay(gameId);
                }
            }
        }

        async function loadPlayByPlay(gameId, homeTeam, awayTeam) {
            const feed = document.getElementById('playbyplay-feed');
            if (!feed) return;

            feed.innerHTML = '<div class="spinner"></div>';

            try {
                const response = await fetch(`${API_BASE}/v1/games/${gameId}/playbyplay?limit=30`);
                const data = await response.json();

                if (response.ok && data.events) {
                    if (data.events.length === 0) {
                        feed.innerHTML = '<div style="color: #aaaaaa; text-align: center; padding: 40px;">No events yet. Start ingestion to see play-by-play.</div>';
                        return;
                    }

                    const mostRecentTime = data.events[0]?.timestamp || Date.now() / 1000;

                    feed.innerHTML = data.events.map((event, index) => {
                        const timeAgo = Math.round((mostRecentTime - event.timestamp) / 60);
                        const timeStr = timeAgo === 0 ? 'Just now' : `${timeAgo}m ago`;
                        const playerInitials = event.player ? event.player.split(' ').map(n => n[0]).join('').substring(0, 2) : '?';
                        const strengthClass = event.strength || 'EV';
                        
                        return `
                            <div class="playbyplay-event">
                                <div class="event-player-avatar">${playerInitials}</div>
                                <div class="event-content">
                                    <div class="event-header">
                                        <span>${event.home_score} - ${event.away_score}</span>
                                        <span>${timeStr}</span>
                                    </div>
                                    <div class="event-description">
                                        ${event.description}
                                        <span class="event-strength ${strengthClass}">${event.strength}</span>
                                    </div>
                                    <div class="event-player">
                                        ${event.player || 'Unknown Player'}
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    feed.innerHTML = '<div style="color: #aaaaaa; text-align: center; padding: 40px;">Error loading play-by-play.</div>';
                }
            } catch (error) {
                feed.innerHTML = `<div style="color: #ee8888; text-align: center; padding: 40px;">Error: ${error.message}</div>`;
            }
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', async function() {
            initDateSelector();
            await loadGamesList();
        });

        // Allow Enter key to submit
        document.getElementById('gameId').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                startIngestion();
            }
        });
    </script>
</body>
</html>
