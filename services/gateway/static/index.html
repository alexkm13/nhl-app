<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHL GameCast</title>
    <link rel="stylesheet" href="/static/styles.css?v=14">
    <script>
        // Aggressive cache clearing
        (function() {
            // Clear service workers
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    for(let registration of registrations) {
                        registration.unregister();
                    }
                });
            }
            
            // Clear all caches
            if ('caches' in window) {
                caches.keys().then(function(names) {
                    for (let name of names) {
                        caches.delete(name);
                    }
                });
            }
            
            // Force reload if page is loaded from cache
            window.addEventListener('pageshow', function(event) {
                if (event.persisted) {
                    window.location.reload();
                }
            });
        })();
    </script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script defer src="https://go.metabet.io/js/global.js"></script>
</head>
<body>
    <div class="header">
        <h1>NHL Scorecast</h1>
    </div>

    <div class="date-selector" id="dateSelector">
        <!-- Dates will be populated by JavaScript -->
    </div>

    <div id="status" class="status"></div>
    <div id="loading" class="spinner" style="display: none;"></div>

    <div class="main-container">
        <div class="main-content-wrapper">
            <div class="games-column">
                <div class="section-header games">Games</div>
                <div class="games-list" id="gamesList">
                    <div class="spinner"></div>
                </div>
            </div>
            <div class="standings-column">
                <div class="section-header">Standings</div>
                <div class="standings-container" id="standingsContainer">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="game-details" id="gameDetails"></div>

    <div class="footer">
        <div class="footer-check">✓</div>
        <span>Official NHL Data</span>
    </div>

    <script>
        const API_BASE = window.location.origin || 'http://localhost:8000';
        
        // Store polling interval for play-by-play updates
        let playByPlayPollInterval = null;
        let goalCheckPollInterval = null; // Fast polling for goal detection
        let liveScorePollInterval = null;
        let powerPlayPollInterval = null; // Polling for power play status
        let gamesListPollInterval = null; // Polling for games list updates
        let currentGameId = null;
        let currentGameIsLive = false;
        let currentHomeTeam = '';
        let currentAwayTeam = '';
        let currentHomeLogo = '';
        let currentAwayLogo = '';
        let lastEventCount = 0; // Track number of events to detect new goals
        let lastGoalCount = 0; // Track goal count to detect new goals
        
        // Cache for game data to enable instant loading
        let gameDataCache = {};
        
        // Store basic game info from games list for instant display
        let gamesListData = {}; // Map of gameId -> basic game info from games list
        
        // Track all live games and their polling intervals
        let liveGamesPolling = {}; // Map of gameId -> { interval, goalCheckInterval, gameData }
        let liveGamesFeedCache = {}; // Map of gameId -> { events, homeTeam, awayTeam, homeLogo, awayLogo, isLive }

        // Initialize date selector
        function initDateSelector() {
            const dateSelector = document.getElementById('dateSelector');
            if (!dateSelector) {
                console.error('Date selector element not found');
                return;
            }
            
            // Clear any existing dates
            dateSelector.innerHTML = '';
            
            const today = new Date();
            const dates = [];
            
            // Show enough dates to fill the top bar (approximately 3 weeks: 10 days back, today, 10 days forward)
            console.log(`[CACHE-BUST v8] Starting date generation. Today: ${today.toLocaleDateString()}`);
            console.log(`[CACHE-BUST v8] Loop will run from -10 to +10 (21 iterations)`);
            
            // Create 21 dates: 10 days back, today, 10 days forward
            for (let i = -10; i <= 10; i++) {
                const date = new Date(today);
                date.setDate(today.getDate() + i);
                dates.push(date);
                console.log(`[CACHE-BUST v8] Loop iteration ${i}: Created date ${date.toLocaleDateString()}`);
            }
            
            console.log(`[CACHE-BUST v8] Total dates created: ${dates.length} (should be 21)`);
            if (dates.length !== 21) {
                console.error(`[CACHE-BUST v8] ERROR: Expected 21 dates but got ${dates.length}!`);
            }

            dates.forEach((date, index) => {
                const dateItem = document.createElement('div');
                dateItem.className = 'date-item';
                
                const month = date.toLocaleDateString('en-US', { month: 'short' });
                const day = date.getDate();
                const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
                
                const dateTop = document.createElement('div');
                dateTop.className = 'date-top';
                dateTop.textContent = `${month} ${day}`;
                
                const dateBottom = document.createElement('div');
                dateBottom.className = 'date-bottom';
                dateBottom.textContent = dayName;
                
                dateItem.appendChild(dateTop);
                dateItem.appendChild(dateBottom);
                
                dateItem.onclick = () => {
                    document.querySelectorAll('.date-item').forEach(item => item.classList.remove('active'));
                    dateItem.classList.add('active');
                    // Switch back to games list view when clicking a date
                    showGamesList();
                    loadGamesList(date);
                };
                
                // Mark today as active (index 10 when range is -10 to +10)
                if (index === 10) {
                    dateItem.classList.add('active');
                }
                
                dateSelector.appendChild(dateItem);
                console.log(`Added date ${index + 1}/${dates.length}: ${month} ${day}, ${dayName}`);
            });
            
            console.log(`Date selector initialized with ${dates.length} dates. Total date items in DOM: ${dateSelector.children.length}`);
            console.log(`Date selector width: ${dateSelector.offsetWidth}px, scrollWidth: ${dateSelector.scrollWidth}px`);
            
            // Ensure the date selector can scroll to show all dates
            if (dateSelector.scrollWidth > dateSelector.offsetWidth) {
                console.log(`Date selector is scrollable (${dateSelector.scrollWidth}px > ${dateSelector.offsetWidth}px)`);
                // Force the date selector to show all content
                dateSelector.style.minWidth = `${dateSelector.scrollWidth}px`;
            }
            
            // Verify all dates are in the DOM
            const allDateItems = dateSelector.querySelectorAll('.date-item');
            console.log(`Found ${allDateItems.length} date items in DOM`);
            if (allDateItems.length !== dates.length) {
                console.error(`Mismatch: Expected ${dates.length} dates but found ${allDateItems.length} in DOM`);
            }
        }

        // Helper function to format date as YYYY-MM-DD in local time
        function formatDateLocal(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // Load games list
        async function loadGamesList(date = null) {
            const gamesList = document.getElementById('gamesList');
            gamesList.innerHTML = '<div class="spinner"></div>';

            try {
                // Always use a date - default to today if not provided
                if (!date) {
                    date = new Date();
                }
                const dateStr = formatDateLocal(date);
                const url = `${API_BASE}/v1/games?date=${dateStr}`;

                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const data = await response.json();

                if (data.games && data.games.length > 0) {
                    // Store basic game info for instant display
                    data.games.forEach(game => {
                        gamesListData[game.game_id] = {
                            game_id: game.game_id,
                            home_team_name: game.home_team_name || game.home_team,
                            away_team_name: game.away_team_name || game.away_team,
                            home_team: game.home_team || '', // Abbreviation from API
                            away_team: game.away_team || '', // Abbreviation from API
                            home_team_logo: game.home_team_logo || '',
                            away_team_logo: game.away_team_logo || '',
                            home_score: game.home_score || 0,
                            away_score: game.away_score || 0,
                            game_state: game.game_state,
                            period: game.period,
                            time_in_period: game.time_in_period,
                            overtime_type: game.overtime_type || null, // OT, SO, or null
                            is_live: game.game_state === 'LIVE' || game.game_state === 'CRIT'
                        };
                    });
                    
                    // Prefetch game data for instant loading
                    prefetchGameData(data.games.map(g => g.game_id));
                    
                    // Check if there are any live games - if so, start polling
                    const hasLiveGames = data.games.some(g => g.game_state === 'LIVE' || g.game_state === 'CRIT');
                    if (hasLiveGames) {
                        startGamesListPolling(date);
                        // Start/update polling for all live games
                        updateLiveGameFeedPolling(data.games);
                    } else {
                        stopGamesListPolling();
                        stopAllLiveGameFeedPolling();
                    }
                    
                    gamesList.innerHTML = data.games.map(game => {
                        const isFinal = game.game_state === 'OFF' || game.game_state === 'FINAL';
                        const homeScore = game.home_score || 0;
                        const awayScore = game.away_score || 0;
                        const homeIsWinner = homeScore > awayScore;
                        const awayIsWinner = awayScore > homeScore;
                        const isTie = homeScore === awayScore;
                        
                        // Format final status text
                        let finalStatusText = "▼ Final";
                        if (isFinal && game.overtime_type === "OT") {
                            finalStatusText = "▼ Final/OT";
                        } else if (isFinal && game.overtime_type === "SO") {
                            finalStatusText = "▼ Final/SO";
                        }
                        
                        // Determine winner/loser for final games
                        // Top team = Away team, Bottom team = Home team
                        if (isFinal && !isTie) {
                            // Away team row (always on top)
                            const awayRow = awayIsWinner ?
                                `<div class="game-score-row winner">
                                    <div class="game-winner-indicator">▶</div>
                                    <img src="${game.away_team_logo || ''}" alt="${game.away_team_name}" class="game-team-logo" onerror="this.style.display='none'">
                                    <div class="game-team-name">${game.away_team_name || game.away_team}</div>
                                    <div class="game-team-score">${awayScore}</div>
                                </div>` :
                                `<div class="game-score-row loser">
                                    <img src="${game.away_team_logo || ''}" alt="${game.away_team_name}" class="game-team-logo" onerror="this.style.display='none'">
                                    <div class="game-team-name">${game.away_team_name || game.away_team}</div>
                                    <div class="game-team-score">${awayScore}</div>
                                </div>`;
                            
                            // Home team row (always on bottom)
                            const homeRow = homeIsWinner ?
                                `<div class="game-score-row winner">
                                    <div class="game-winner-indicator">▶</div>
                                    <img src="${game.home_team_logo || ''}" alt="${game.home_team_name}" class="game-team-logo" onerror="this.style.display='none'">
                                    <div class="game-team-name">${game.home_team_name || game.home_team}</div>
                                    <div class="game-team-score">${homeScore}</div>
                                </div>` :
                                `<div class="game-score-row loser">
                                    <img src="${game.home_team_logo || ''}" alt="${game.home_team_name}" class="game-team-logo" onerror="this.style.display='none'">
                                    <div class="game-team-name">${game.home_team_name || game.home_team}</div>
                                    <div class="game-team-score">${homeScore}</div>
                                </div>`;
                            
                            return `
                                <div class="game-card" onclick="selectGame('${game.game_id}')">
                                    <div class="game-card-header">
                                        <span class="game-status-text">${finalStatusText}</span>
                                    </div>
                                    <div class="game-score-teams">
                                        ${awayRow}
                                        ${homeRow}
                                    </div>
                                </div>
                            `;
                        } else {
                            // Live or future game - show live format
                            const isLive = game.game_state === 'LIVE' || game.game_state === 'CRIT';
                            
                            // For live games, show period and time remaining. Otherwise, show scheduled start time
                            let gameTimeDisplay = 'TBD';
                            let periodDisplay = '';
                            if (isLive) {
                                // For live games, always try to show period and time remaining
                                const period = game.period || game.periodDescriptor?.number || null;
                                const timeInPeriod = game.time_in_period || game.timeInPeriod || null;
                                
                                if (period && timeInPeriod) {
                                    // Format period: "1st", "2nd", "3rd", "OT", etc.
                                    let periodLabel;
                                    if (period === 1) {
                                        periodLabel = '1st';
                                    } else if (period === 2) {
                                        periodLabel = '2nd';
                                    } else if (period === 3) {
                                        periodLabel = '3rd';
                                    } else if (period === 4) {
                                        periodLabel = 'OT';
                                    } else {
                                        periodLabel = `${period}th`;
                                    }
                                    
                                    // Convert time based on source
                                    // If is_time_remaining is true, timeInPeriod is already time remaining
                                    // If false or undefined, timeInPeriod is elapsed time and needs conversion
                                    const isTimeRemaining = game.is_time_remaining === true;
                                    let formattedTime;
                                    if (timeInPeriod && timeInPeriod !== '00:00') {
                                        if (isTimeRemaining) {
                                            // Already time remaining, use directly
                                            const [minutes, seconds] = timeInPeriod.split(':').map(Number);
                                            formattedTime = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                                        } else {
                                            // Convert elapsed time to remaining
                                            const [elapsedMinutes, elapsedSeconds] = timeInPeriod.split(':').map(Number);
                                            const elapsedTotalSeconds = elapsedMinutes * 60 + elapsedSeconds;
                                            
                                            // Determine period length: 20 minutes (1200 seconds) for regulation, 5 minutes (300 seconds) for OT
                                            const periodLengthSeconds = (period <= 3) ? 1200 : 300;
                                            const remainingTotalSeconds = Math.max(0, periodLengthSeconds - elapsedTotalSeconds);
                                            
                                            const remainingMinutes = Math.floor(remainingTotalSeconds / 60);
                                            const remainingSecs = remainingTotalSeconds % 60;
                                            formattedTime = `${remainingMinutes}:${remainingSecs.toString().padStart(2, '0')}`;
                                        }
                                    } else {
                                        // If time is 00:00, show full period time remaining
                                        formattedTime = (period <= 3) ? '20:00' : '5:00';
                                    }
                                    
                                    // Separate time and period for display
                                    gameTimeDisplay = formattedTime;
                                    periodDisplay = periodLabel;
                                } else {
                                    // If period/time data is missing, show default time remaining
                                    gameTimeDisplay = '20:00';
                                    periodDisplay = '1st';
                                }
                            } else if (game.start_time_utc) {
                                try {
                                    const utcDate = new Date(game.start_time_utc);
                                    const localTime = utcDate.toLocaleTimeString('en-US', {
                                        hour: 'numeric',
                                        minute: '2-digit',
                                        hour12: true
                                    });
                                    gameTimeDisplay = localTime;
                                } catch (e) {
                                    gameTimeDisplay = 'TBD';
                                }
                            }
                            
                            // Only show records for games that haven't started
                            const showRecords = !isLive;
                            const awayRecord = showRecords && game.away_team_record ? `<div class="game-team-record">${game.away_team_record}</div>` : '';
                            const homeRecord = showRecords && game.home_team_record ? `<div class="game-team-record">${game.home_team_record}</div>` : '';
                            
                            return `
                                <div class="game-card ${isLive ? 'live' : ''}" onclick="selectGame('${game.game_id}')">
                                    <div class="game-live-score">
                                        <div class="game-live-team-left">
                                            <img src="${game.away_team_logo || ''}" alt="${game.away_team_name}" class="game-live-logo" onerror="this.style.display='none'">
                                            <div class="game-live-score-num">${awayScore}</div>
                                            <div class="game-live-team-name">${game.away_team_name || game.away_team}</div>
                                            ${awayRecord}
                                        </div>
                                        <div class="game-live-time-container">
                                            ${isLive ? '<div class="game-live-indicator"></div>' : ''}
                                            <div class="game-live-time">${gameTimeDisplay}</div>
                                            ${isLive ? 
                                                `<div class="game-spread">${periodDisplay}</div>` :
                                                (game.spread !== null && game.spread !== undefined ? 
                                                    `<div class="game-spread">${game.spread_favorite === 'home' ? game.home_team_name : game.away_team_name} ${game.spread > 0 ? '+' : ''}${game.spread}</div>` : 
                                                    '<div class="game-spread">N/A</div>')}
                                        </div>
                                        <div class="game-live-team-right">
                                            <img src="${game.home_team_logo || ''}" alt="${game.home_team_name}" class="game-live-logo" onerror="this.style.display='none'">
                                            <div class="game-live-score-num">${homeScore}</div>
                                            <div class="game-live-team-name">${game.home_team_name || game.home_team}</div>
                                            ${homeRecord}
                                        </div>
                                    </div>
                                </div>
                            `;
                        }
                    }).join('');
                } else {
                    gamesList.innerHTML = '<div style="color: #aaaaaa; padding: 20px; text-align: center;">No games scheduled for this date</div>';
                }
            } catch (error) {
                console.error('Error loading games:', error);
                gamesList.innerHTML = '<div style="color: #ee8888; padding: 20px; text-align: center;">Error loading games</div>';
            }
        }

        // Prefetch game data for all games on current date
        async function prefetchGameData(gameIds) {
            // Prefetch in parallel for all games - both win probability and play-by-play
            const prefetchPromises = gameIds.map(async (gameId) => {
                try {
                    // Prefetch win probability
                    const winprobResponse = await fetch(`${API_BASE}/v1/games/${gameId}/winprob/friendly`);
                    if (winprobResponse.ok) {
                        const data = await winprobResponse.json();
                        gameDataCache[gameId] = data;
                    }
                    
                    // Prefetch play-by-play data (this will populate Redis cache)
                    // Don't await - just fire and forget to populate cache
                    fetch(`${API_BASE}/v1/games/${gameId}/playbyplay?limit=50`).catch(() => {});
                } catch (error) {
                    // Silently fail - we'll fetch on demand if needed
                }
            });
            // Don't await - let it run in background
            Promise.all(prefetchPromises).catch(() => {});
        }
        
        async function selectGame(gameId) {
            // Hide games list immediately
            showGameDetails();
            
            // Show cached data immediately for instant display
            if (gameDataCache[gameId]) {
                displayResults(gameDataCache[gameId]);
                // Fetch fresh data in background (non-blocking)
                fetch(`${API_BASE}/v1/games/${gameId}/winprob/friendly`)
                    .then(response => {
                        if (response.ok) {
                            return response.json();
                        }
                        return null;
                    })
                    .then(data => {
                        if (data) {
                            gameDataCache[gameId] = data; // Update cache
                            // Update display if still viewing this game
                            if (currentGameId === gameId) {
                                displayResults(data);
                            }
                        }
                    })
                    .catch(error => {
                        console.error('Error refreshing game data:', error);
                    });
                return; // Return immediately after showing cached data
            }
            
            // No cache - show basic info immediately if available from games list, then fetch full data
            const basicInfo = gamesListData[gameId];
            if (basicInfo) {
                // Show basic game info immediately for instant display
                showBasicGameInfo(gameId, basicInfo);
                // Fetch full data in background (non-blocking)
                fetch(`${API_BASE}/v1/games/${gameId}/winprob/friendly`)
                    .then(response => {
                        if (response.ok) {
                            return response.json();
                        }
                        return null;
                    })
                    .then(data => {
                        if (data) {
                            gameDataCache[gameId] = data; // Cache it
                            // Update display if still viewing this game
                            if (currentGameId === gameId) {
                                displayResults(data);
                            }
                        }
                    })
                    .catch(error => {
                        // Silently handle network errors - don't spam console
                        // Only log if it's a non-network error
                        if (error.name !== 'TypeError' || !error.message.includes('fetch')) {
                            console.error('Error fetching game data:', error);
                        }
                        // If fetch fails, start ingestion (but don't block feed loading)
                        if (currentGameId === gameId) {
                            startIngestionForGame(gameId).catch(() => {
                                // Silently fail - feed should still work
                            });
                        }
                    });
                return; // Return immediately after showing basic info
            }
            
            // No basic info either - show loading state and fetch
            const gameDetails = document.getElementById('gameDetails');
            const placeholder = document.getElementById('game-content-placeholder');
            if (placeholder) {
                placeholder.innerHTML = '<div class="spinner"></div><div style="text-align: center; color: #aaaaaa; margin-top: 20px;">Loading game...</div>';
            }
            
            // Fetch fresh data (non-blocking)
            fetch(`${API_BASE}/v1/games/${gameId}/winprob/friendly`)
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    }
                    return null;
                })
                .then(data => {
                    if (data) {
                        gameDataCache[gameId] = data; // Cache it
                        if (currentGameId === gameId) {
                            displayResults(data);
                        }
                    } else {
                        // If fetch fails, start ingestion
                        if (currentGameId === gameId) {
                            startIngestionForGame(gameId).catch(err => {
                                console.error('Error starting ingestion:', err);
                            });
                        }
                    }
                })
                .catch(error => {
                    // Silently handle network errors - don't spam console
                    // Only log if it's a non-network error
                    if (error.name !== 'TypeError' || !error.message.includes('fetch')) {
                        console.error('Error fetching game data:', error);
                    }
                    // If fetch fails, start ingestion (but don't block feed loading)
                    if (currentGameId === gameId) {
                        startIngestionForGame(gameId).catch(() => {
                            // Silently fail - feed should still work
                        });
                    }
                });
        }
        
        // Show basic game info immediately while fetching full data
        function showBasicGameInfo(gameId, basicInfo) {
            const homeTeam = basicInfo.home_team_name || 'Home';
            const awayTeam = basicInfo.away_team_name || 'Away';
            const homeLogo = basicInfo.home_team_logo || '';
            const awayLogo = basicInfo.away_team_logo || '';
            const homeScore = basicInfo.home_score || 0;
            const awayScore = basicInfo.away_score || 0;
            const isLive = basicInfo.is_live || false;
            const gameState = basicInfo.game_state || '';
            const isFinal = gameState === 'OFF' || gameState === 'FINAL';
            const period = basicInfo.period || 1;
            const timeInPeriod = basicInfo.time_in_period || '00:00';
            const overtimeType = basicInfo.overtime_type || null;
            
            // Format time and period for live games, or final status for finished games
            let timeDisplay = '';
            let periodDisplay = '';
            let statusDisplay = '';
            
            if (isFinal) {
                // For finished games, show "Final", "Final/OT", or "Final/SO"
                if (overtimeType === 'OT') {
                    statusDisplay = 'Final/OT';
                } else if (overtimeType === 'SO') {
                    statusDisplay = 'Final/SO';
                } else {
                    statusDisplay = 'Final';
                }
                // For final games, hide time and period, show final status instead
                timeDisplay = '';
                periodDisplay = '';
            } else {
                // Convert time elapsed to time remaining
                // timeInPeriod is elapsed time in MM:SS format (e.g., "00:30" = 30 seconds elapsed)
                // We need to convert to time remaining
                if (timeInPeriod && timeInPeriod !== '00:00') {
                    const [elapsedMinutes, elapsedSeconds] = timeInPeriod.split(':').map(Number);
                    const elapsedTotalSeconds = elapsedMinutes * 60 + elapsedSeconds;
                    
                    // Determine period length: 20 minutes (1200 seconds) for regulation, 5 minutes (300 seconds) for OT
                    const periodLengthSeconds = (period <= 3) ? 1200 : 300;
                    const remainingTotalSeconds = Math.max(0, periodLengthSeconds - elapsedTotalSeconds);
                    
                    const remainingMinutes = Math.floor(remainingTotalSeconds / 60);
                    const remainingSecs = remainingTotalSeconds % 60;
                    timeDisplay = `${remainingMinutes}:${remainingSecs.toString().padStart(2, '0')}`;
                } else {
                    // If time is 00:00, show full period time remaining
                    timeDisplay = (period <= 3) ? '20:00' : '5:00';
                }
                
                if (period === 1) {
                    periodDisplay = '1st';
                } else if (period === 2) {
                    periodDisplay = '2nd';
                } else if (period === 3) {
                    periodDisplay = '3rd';
                } else if (period === 4) {
                    periodDisplay = 'OT';
                } else {
                    periodDisplay = `${period}th`;
                }
            }
            
            const gameDetails = document.getElementById('gameDetails');
            const placeholder = document.getElementById('game-content-placeholder');
            
            // Show basic scoreboard immediately
            gameDetails.innerHTML = `
                <div class="back-button-container">
                    <button class="back-button" onclick="showGamesList()">← Back to Games</button>
                </div>
                <div class="scoreboard-winprob-container">
                    <div class="live-score-container">
                        <div class="live-score-teams">
                            <div class="live-team-row">

        async function pollForResults(gameId) {
            try {
                const statusResponse = await fetch(`${API_BASE}/v1/games/${gameId}/status`);
                
                if (!statusResponse.ok) {
                    throw new Error(`HTTP ${statusResponse.status}: ${statusResponse.statusText}`);
                }
                
                let statusData;
                try {
                    statusData = await statusResponse.json();
                } catch (jsonError) {
                    const text = await statusResponse.text();
                    throw new Error(`Invalid JSON response: ${text.substring(0, 100)}`);
                }

                if (statusData.has_prediction) {
                    await fetchResults(gameId);
                    return;
                }

                if (statusData.ingestion_status === 'in_progress') {
                    // Update placeholder to show loading state
                    const placeholder = document.getElementById('game-content-placeholder');
                    if (placeholder) {
                        placeholder.innerHTML = '<div class="spinner"></div><div style="text-align: center; color: #aaaaaa; margin-top: 20px;">Ingestion in progress. Waiting for results...</div>';
                    }
                    setTimeout(() => pollForResults(gameId), 5000);
                    return;
                }

                if (statusData.ingestion_status === 'failed') {
                    // Show error message in game details with back button already visible
                    const gameDetails = document.getElementById('gameDetails');
                    const placeholder = document.getElementById('game-content-placeholder');
                    if (placeholder) {
                        placeholder.innerHTML = `
                            <div style="text-align: center; padding: 40px; color: #ee8888;">
                                <div style="font-size: 1.2em; margin-bottom: 10px;">Ingestion Failed</div>
                                <div>${statusData.error || 'Unknown error'}</div>
                            </div>
                        `;
                    }
                    return;
                }

                // Update placeholder to show processing state
                const placeholder = document.getElementById('game-content-placeholder');
                if (placeholder) {
                    placeholder.innerHTML = '<div class="spinner"></div><div style="text-align: center; color: #aaaaaa; margin-top: 20px;">Processing... Please wait</div>';
                }
                setTimeout(() => pollForResults(gameId), 5000);
            } catch (error) {
                console.error('Status check error:', error);
                const errorMsg = error.message || 'Network error';
                // Show error message in game details
                const placeholder = document.getElementById('game-content-placeholder');
                if (placeholder) {
                    placeholder.innerHTML = `
                        <div style="text-align: center; padding: 40px; color: #ee8888;">
                            <div style="font-size: 1.2em; margin-bottom: 10px;">Error</div>
                            <div>${errorMsg}</div>
                        </div>
                    `;
                }
            }
        }

        function startGamesListPolling(date) {
            // Stop any existing polling
            stopGamesListPolling();
            
            // Poll every 2 seconds for games list updates (to refresh live game periods/times more frequently)
            gamesListPollInterval = setInterval(async () => {
                // Only poll if we're on the games list (not in game details)
                const mainContainer = document.querySelector('.main-container');

                    // Reload games list in background to update live game info
                    try {
                        const dateStr = formatDateLocal(date || new Date());
                        const url = `${API_BASE}/v1/games?date=${dateStr}`;
                        const response = await fetch(url);
                        if (!response.ok) {
                            // Silently fail - will retry on next poll
                            return;
                        }
                        const data = await response.json();
                        
                        if (data.games && data.games.length > 0) {
                            // Update basic game info for instant display
                            data.games.forEach(game => {
                                gamesListData[game.game_id] = {
                                    game_id: game.game_id,
                                    home_team_name: game.home_team_name || game.home_team,
                                    away_team_name: game.away_team_name || game.away_team,
                                    home_team: game.home_team || '', // Abbreviation from API
                                    away_team: game.away_team || '', // Abbreviation from API
                                    home_team_logo: game.home_team_logo || '',
                                    away_team_logo: game.away_team_logo || '',
                                    home_score: game.home_score || 0,
                                    away_score: game.away_score || 0,
                                    game_state: game.game_state,
                                    period: game.period,
                                    time_in_period: game.time_in_period,
                                    overtime_type: game.overtime_type || null, // OT, SO, or null
                                    is_live: game.game_state === 'LIVE' || game.game_state === 'CRIT'
                                };
                            });
                            
                            // Check if there are still live games
                            const hasLiveGames = data.games.some(g => g.game_state === 'LIVE' || g.game_state === 'CRIT');
                            if (!hasLiveGames) {
                                stopGamesListPolling();
                                stopAllLiveGameFeedPolling();
                            } else {
                                // Start/update polling for all live games
                                updateLiveGameFeedPolling(data.games);
                            }
                            
                            // Only update if we're still on the games list
                            const mainContainerCheck = document.querySelector('.main-container');
                            if (mainContainerCheck && mainContainerCheck.style.display !== 'none') {
                                // Re-render games list with updated data
                                const gamesList = document.getElementById('gamesList');
                                if (gamesList) {
                                    // Use the same rendering logic as loadGamesList
                                    gamesList.innerHTML = data.games.map(game => {
                                        const isFinal = game.game_state === 'OFF' || game.game_state === 'FINAL';
                                        const homeScore = game.home_score || 0;
                                        const awayScore = game.away_score || 0;
                                        const homeIsWinner = homeScore > awayScore;
                                        const awayIsWinner = awayScore > homeScore;
                                        const isTie = homeScore === awayScore;
                                        
                                        // Format final status text
                                        let finalStatusText = "▼ Final";
                                        if (isFinal && game.overtime_type === "OT") {
                                            finalStatusText = "▼ Final/OT";
                                        } else if (isFinal && game.overtime_type === "SO") {
                                            finalStatusText = "▼ Final/SO";
                                        }
                                        
                                        if (isFinal && !isTie) {
                                            // Final game display (same as before)
                                            const awayRow = awayIsWinner ?
                                                `<div class="game-score-row winner">
                                                    <div class="game-winner-indicator">▶</div>
                                                    <img src="${game.away_team_logo || ''}" alt="${game.away_team_name}" class="game-team-logo" onerror="this.style.display='none'">
                                                    <div class="game-team-name">${game.away_team_name || game.away_team}</div>
                                                    <div class="game-team-score">${awayScore}</div>
                                                </div>` :
                                                `<div class="game-score-row loser">
                                                    <img src="${game.away_team_logo || ''}" alt="${game.away_team_name}" class="game-team-logo" onerror="this.style.display='none'">
                                                    <div class="game-team-name">${game.away_team_name || game.away_team}</div>
                                                    <div class="game-team-score">${awayScore}</div>
                                                </div>`;
                                            
                                            const homeRow = homeIsWinner ?
                                                `<div class="game-score-row winner">
                                                    <div class="game-winner-indicator">▶</div>
                                                    <img src="${game.home_team_logo || ''}" alt="${game.home_team_name}" class="game-team-logo" onerror="this.style.display='none'">
                                                    <div class="game-team-name">${game.home_team_name || game.home_team}</div>
                                                    <div class="game-team-score">${homeScore}</div>
                                                </div>` :
                                                `<div class="game-score-row loser">
                                                    <img src="${game.home_team_logo || ''}" alt="${game.home_team_name}" class="game-team-logo" onerror="this.style.display='none'">
                                                    <div class="game-team-name">${game.home_team_name || game.home_team}</div>

                                                    <div class="game-score-teams">
                                                        ${awayRow}
                                                        ${homeRow}
                                                    </div>
                                                </div>
                                            `;
                                        } else {
                                            // Live or future game display (same as before)
                                            const isLive = game.game_state === 'LIVE' || game.game_state === 'CRIT';
                                            
                                            let gameTimeDisplay = 'TBD';
                                            let periodDisplay = '';
                                            if (isLive) {
                                                // For live games, always try to show period and time remaining
                                                const period = game.period || game.periodDescriptor?.number || null;
                                                const timeInPeriod = game.time_in_period || game.timeInPeriod || null;
                                                
                                                if (period && timeInPeriod) {
                                                    // Format period: "1st", "2nd", "3rd", "OT", etc.
                                                    let periodLabel;
                                                    if (period === 1) {
                                                        periodLabel = '1st';
                                                    } else if (period === 2) {
                                                        periodLabel = '2nd';
                                                    } else if (period === 3) {
                                                        periodLabel = '3rd';
                                                    } else if (period === 4) {
                                                        periodLabel = 'OT';
                                                    } else {
                                                        periodLabel = `${period}th`;
                                                    }
                                                    
                                                    // Convert time based on source
                                                    // If is_time_remaining is true, timeInPeriod is already time remaining
                                                    // If false or undefined, timeInPeriod is elapsed time and needs conversion
                                                    const isTimeRemaining = game.is_time_remaining === true;
                                                    let formattedTime;
                                                    if (timeInPeriod && timeInPeriod !== '00:00') {
                                                        if (isTimeRemaining) {
                                                            // Already time remaining, use directly
                                                            const [minutes, seconds] = timeInPeriod.split(':').map(Number);
                                                            formattedTime = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                                                        } else {
                                                            // Convert elapsed time to remaining
                                                            const [elapsedMinutes, elapsedSeconds] = timeInPeriod.split(':').map(Number);
                                                            const elapsedTotalSeconds = elapsedMinutes * 60 + elapsedSeconds;
                                                            
                                                            // Determine period length: 20 minutes (1200 seconds) for regulation, 5 minutes (300 seconds) for OT
                                                            const periodLengthSeconds = (period <= 3) ? 1200 : 300;
                                                            const remainingTotalSeconds = Math.max(0, periodLengthSeconds - elapsedTotalSeconds);
                                                            
                                                            const remainingMinutes = Math.floor(remainingTotalSeconds / 60);
                                                            const remainingSecs = remainingTotalSeconds % 60;
                                                            formattedTime = `${remainingMinutes}:${remainingSecs.toString().padStart(2, '0')}`;
                                                        }
                                                    } else {
                                                        // If time is 00:00, show full period time remaining
                                                        formattedTime = (period <= 3) ? '20:00' : '5:00';
                                                    }
                                                    
                                                    // Separate time and period for display
                                                    gameTimeDisplay = formattedTime;
                                                    periodDisplay = periodLabel;
                                                } else {
                                                    // If period/time data is missing, show default time remaining
                                                    gameTimeDisplay = '20:00';
                                                    periodDisplay = '1st';
                                                }
                                            } else if (game.start_time_utc) {
                                                try {
                                                    const utcDate = new Date(game.start_time_utc);
                                                    const localTime = utcDate.toLocaleTimeString('en-US', {
                                                        hour: 'numeric',
                                                        minute: '2-digit',
                                                        hour12: true
                                                    });
                                                    gameTimeDisplay = localTime;
                                                } catch (e) {
                                                    gameTimeDisplay = 'TBD';
                                                }
                                            }
                                            
                                            const showRecords = !isLive;
                                            const awayRecord = showRecords && game.away_team_record ? `<div class="game-team-record">${game.away_team_record}</div>` : '';
                                            const homeRecord = showRecords && game.home_team_record ? `<div class="game-team-record">${game.home_team_record}</div>` : '';
                                            
                                            return `
                                                <div class="game-card ${isLive ? 'live' : ''}" onclick="selectGame('${game.game_id}')">
                                                    <div class="game-live-score">
                                                        <div class="game-live-team-left">
                                                            <img src="${game.away_team_logo || ''}" alt="${game.away_team_name}" class="game-live-logo" onerror="this.style.display='none'">
                                                            <div class="game-live-score-num">${awayScore}</div>
                                                            <div class="game-live-team-name">${game.away_team_name || game.away_team}</div>
                                                            ${awayRecord}
                                                        </div>
                                                        <div class="game-live-time-container">
                                                            ${isLive ? '<div class="game-live-indicator"></div>' : ''}
                                                            <div class="game-live-time">${gameTimeDisplay}</div>
                                                            ${isLive ? 
                                                                `<div class="game-spread">${periodDisplay}</div>` :
                                                                (game.spread !== null && game.spread !== undefined ? 
                                                                    `<div class="game-spread">${game.spread_favorite === 'home' ? game.home_team_name : game.away_team_name} ${game.spread > 0 ? '+' : ''}${game.spread}</div>` : 
                                                                    '<div class="game-spread">N/A</div>')}
                                                        </div>
                                                        <div class="game-live-team-right">
                                                            <img src="${game.home_team_logo || ''}" alt="${game.home_team_name}" class="game-live-logo" onerror="this.style.display='none'">
                                                            <div class="game-live-score-num">${homeScore}</div>
                                                            <div class="game-live-team-name">${game.home_team_name || game.home_team}</div>
                                                            ${homeRecord}
                                                        </div>
                                                    </div>
                                                </div>
                                            `;
                                        }
                                    }).join('');
                                }
                            }
                        }
                    } catch (error) {
                        // Silently handle network errors - don't spam console
                        // Only log if it's a non-network error
                        if (error.name !== 'TypeError' || !error.message.includes('fetch')) {
                            console.error('Error polling games list:', error);
                        }
                        // Will retry on next poll interval
                    }
                } else {
                    stopGamesListPolling();
                }
            }, 2000); // Poll every 2 seconds for faster updates (scoreboards and times always updated)
        }
        
        function stopGamesListPolling() {
            if (gamesListPollInterval !== null) {
                clearInterval(gamesListPollInterval);
                gamesListPollInterval = null;
            }
        }
        
        // Function to update polling for all live games
        // Polling is now only active when viewing a specific game, not for all games in background
        function updateLiveGameFeedPolling(games) {
            const liveGames = games.filter(g => g.game_state === 'LIVE' || g.game_state === 'CRIT');
            
            // Stop polling for games that are no longer live (only if they're not currently being viewed)
            const currentLiveGameIds = new Set(liveGames.map(g => g.game_id));
            for (const gameId in liveGamesPolling) {
                // Only stop if game is no longer live AND not currently being viewed
                if (!currentLiveGameIds.has(gameId) && currentGameId !== gameId) {
                    // Game is no longer live and not being viewed, stop its polling
                    stopGameFeedPolling(gameId);
                }
            }
            
            // DON'T start polling for all games - only poll when viewing a specific game
            // This prevents freezing from too many simultaneous updates
        }
        
        // Function to start polling for a specific game (ONLY when viewing it)
        function startGameFeedPolling(gameId, gameData) {
            // Only poll if this is the currently viewed game
            if (currentGameId !== gameId) {
                return; // Don't poll games we're not viewing
            }
            
            // Stop any existing polling for this game
            stopGameFeedPolling(gameId);
            
            // Reset feed tracking when starting to view a new game
            renderedEventIds.clear();
            lastRenderedEventCount = 0;
            
            // Initialize cache for this game if it doesn't exist
            if (!liveGamesFeedCache[gameId]) {
                liveGamesFeedCache[gameId] = {
                    homeTeam: gameData.home_team_name || '',
                    awayTeam: gameData.away_team_name || '',
                    homeLogo: gameData.home_team_logo || '',
                    awayLogo: gameData.away_team_logo || '',
                    isLive: true
                };
            }
            
            // Update feed cache immediately
            updateGameFeedCache(gameId);
            
            // Ultra-fast polling (every 500ms) specifically for goals - goals must appear immediately
            const goalCheckInterval = setInterval(async () => {
                // Only poll if we're still viewing this game
                if (currentGameId !== gameId) {
                    clearInterval(goalCheckInterval);
                    return;
                }
                
                try {
                    const response = await fetch(`${API_BASE}/v1/games/${gameId}/playbyplay?limit=10`);
                    if (response.ok) {
                        const data = await response.json();
                        if (data.events && data.events.length > 0) {
                            const currentGoalCount = data.events.filter(e => e.event_type === 'GOAL').length;
                            const currentEventCount = data.events.length;
                            
                            // Cache the feed data
                            if (liveGamesFeedCache[gameId]) {
                                liveGamesFeedCache[gameId].eventCount = currentEventCount;
                                liveGamesFeedCache[gameId].goalCount = currentGoalCount;
                            }
                            
                            // If we detect ANY new events (not just goals), refresh the full feed immediately
                            const cached = liveGamesFeedCache[gameId];
                            if (cached && (currentGoalCount > (cached.lastGoalCount || 0) || currentEventCount > (cached.lastEventCount || 0))) {
                                // New events detected! Refresh full feed immediately (non-blocking)
                                // Don't await - let it run in background
                                updateGameFeedCache(gameId).catch(() => {
                                    // Silently fail - errors are logged in updateGameFeedCache
                                });
                            }
                        }
                    }
                } catch (error) {
                    // Silently handle network errors - don't spam console

            }, 500); // Check every 500ms for goals and new events (ultra-fast for immediate goal display)
            
            // Normal polling every 1 second for general updates (faster feed updates)
            const pollInterval = setInterval(async () => {

                    updateGameFeedCache(gameId).catch(() => {

                    });

                    const response = await fetch(`${API_BASE}/v1/games/${gameId}/winprob/friendly`);
                    if (response.ok) {

                        if (!isLive) {
                            // Game is no longer live, stop polling
                            stopGameFeedPolling(gameId);

                } catch (error) {
                    // Silently handle network errors - don't spam console
                    // Only log if it's a non-network error
                    if (error.name !== 'TypeError' || !error.message.includes('fetch')) {
                        console.error('Error in normal polling interval:', error);

                }
            }, 1000); // Poll every 1 second for faster feed updates
            
            // Store intervals for this game
            liveGamesPolling[gameId] = {
                interval: pollInterval,

        // Track ongoing updates to prevent conflicts
        const ongoingFeedUpdates = new Set();
        
        // Function to update feed cache for a game (background update)
        async function updateGameFeedCache(gameId) {
            // Prevent multiple simultaneous updates for the same game
            if (ongoingFeedUpdates.has(gameId)) {
                return;
            }
            
            ongoingFeedUpdates.add(gameId);
            try {
                const response = await fetch(`${API_BASE}/v1/games/${gameId}/playbyplay?limit=50`);
                if (!response.ok) {
                    console.error(`[Feed] Failed to fetch play-by-play for ${gameId}: ${response.status} ${response.statusText}`);
                    ongoingFeedUpdates.delete(gameId);
                    return;
                }
                
                const data = await response.json();
                // Only log if we have events to help debug
                if (data.events && data.events.length > 0) {
                    console.log(`[Feed] Received data for ${gameId}:`, {
                        hasEvents: !!data.events,
                        eventCount: data.events?.length || 0,
                        gameState: data.game_state
                    });
                }
                
                if (data.events) {
                    const cached = liveGamesFeedCache[gameId];
                    if (cached) {
                        cached.events = data.events;
                        cached.lastEventCount = data.events.length;
                        cached.lastGoalCount = data.events.filter(e => e.event_type === 'GOAL').length;
                        cached.lastUpdate = Date.now();
                        // Update game state from API response
                        if (data.game_state) {
                            cached.gameState = data.game_state;
                        }
                        
                        // If this is the currently viewed game, update the display
                        if (currentGameId === gameId) {
                            const feed = document.getElementById('playbyplay-feed');

                                try {
                                    // Update the feed display using cached data
                                    const isLive = cached.isLive !== undefined ? cached.isLive : (data.game_state === 'LIVE' || data.game_state === 'CRIT');
                                    renderFeedEvents(cached.events, cached.homeTeam, cached.awayTeam, cached.homeLogo, cached.awayLogo, isLive, gameId, data.game_state);
                                } catch (renderError) {
                                    console.error('Error rendering feed events:', renderError);
                                    // Don't stop polling on render errors
                                }
                            }
                        }
                    } else {
                        // Initialize cache if it doesn't exist
                        if (!liveGamesFeedCache[gameId]) {
                            const gameData = liveGamesPolling[gameId]?.gameData || {};
                            liveGamesFeedCache[gameId] = {
                                homeTeam: gameData.home_team_name || '',
                                awayTeam: gameData.away_team_name || '',
                                homeLogo: gameData.home_team_logo || '',
                                awayLogo: gameData.away_team_logo || '',

                            };

                        const cached = liveGamesFeedCache[gameId];
                        if (cached) {
                            cached.events = data.events || [];
                            cached.lastEventCount = data.events ? data.events.length : 0;
                            cached.lastGoalCount = data.events ? data.events.filter(e => e.event_type === 'GOAL').length : 0;
                            cached.lastUpdate = Date.now();
                        }
                    }
                }
            } catch (error) {
                // Silently handle network errors - don't spam console
                // Only log if it's a non-network error or if it's the first error
                if (error.name !== 'TypeError' || !error.message.includes('fetch')) {
                    console.error('Error updating feed cache:', error);
                }
                // Don't stop polling on errors - will retry on next poll
            } finally {
                ongoingFeedUpdates.delete(gameId);
            }
        }
        
        // Function to stop polling for a specific game
        function stopGameFeedPolling(gameId) {
            if (liveGamesPolling[gameId]) {
                if (liveGamesPolling[gameId].interval) {
                    clearInterval(liveGamesPolling[gameId].interval);
                }
                if (liveGamesPolling[gameId].goalCheckInterval) {
                    clearInterval(liveGamesPolling[gameId].goalCheckInterval);

                delete liveGamesPolling[gameId];

        function updateLiveScoreDisplay(data) {

            const period = game.period || 1;

            const isLive = game.is_live || false;
            
            // Convert time elapsed to time remaining
            // timeInPeriod is elapsed time in MM:SS format (e.g., "00:30" = 30 seconds elapsed)
            // We need to convert to time remaining
            let timeDisplay = '';
            if (timeInPeriod && timeInPeriod !== '00:00') {

                const periodLengthSeconds = (period <= 3) ? 1200 : 300;
                const remainingTotalSeconds = Math.max(0, periodLengthSeconds - elapsedTotalSeconds);

                const remainingSecs = remainingTotalSeconds % 60;
                timeDisplay = `${remainingMinutes}:${remainingSecs.toString().padStart(2, '0')}`;

            }
            
            // If history data is sparse or missing, generate probability points from game events
            // This ensures the graph shows changes even if database predictions are limited
            if (historyData.length < 10) {
                try {
                    // Fetch play-by-play to generate probability points from game events
                    const playByPlayResponse = await fetch(`${API_BASE}/v1/games/${gameId}/playbyplay`);
                    if (playByPlayResponse.ok) {
                        const playByPlayData = await playByPlayResponse.json();
                        const events = playByPlayData.events || [];
                        
                        // Filter for crucial events (goals, major score changes)
                        const crucialEvents = events.filter(e => e.event_type === 'GOAL' || e.event_type === 'PENALTY');
                        
                        // Generate probability points at these events
                        // We'll use a simple calculation: probability changes based on score differential and time
                        let homeScore = 0;
                        let awayScore = 0;
                        let gameTime = 0;
                        const generatedPoints = [];
                        
                        // Add initial point at game start (50/50)
                        generatedPoints.push({ ts: 0, p_home_win: 0.5 });
                        
                        // Process events chronologically (oldest first)
                        // Events come from backend most recent first, so we need to sort chronologically
                        // time_in_period from play-by-play events is TIME REMAINING, not elapsed
                        // More remaining = earlier in period, less remaining = later in period
                        const sortedEvents = [...crucialEvents].sort((a, b) => {
                            // Sort by period (ascending), then by time_in_period (descending for remaining time)
                            if (a.period !== b.period) return a.period - b.period;
                            // Convert time_in_period from MM:SS to seconds for comparison
                            // time_in_period is REMAINING time, so larger = more remaining = earlier in period
                            const aTime = a.time_in_period ? (parseInt(a.time_in_period.split(':')[0]) * 60 + parseInt(a.time_in_period.split(':')[1]) || 0) : 0;
                            const bTime = b.time_in_period ? (parseInt(b.time_in_period.split(':')[0]) * 60 + parseInt(b.time_in_period.split(':')[1]) || 0) : 0;
                            return bTime - aTime; // Descending order (most remaining = oldest first)
                        });
                        
                        // Calculate game time and probability for each event
                        for (const event of sortedEvents) {
                            // Update score BEFORE calculating probability (so probability reflects score after this goal)
                            if (event.event_type === 'GOAL') {
                                if (event.team === 'HOME') {
                                    homeScore++;
                                } else {
                                    awayScore++;
                                }
                            }
                            
                            // Calculate game time in seconds
                            const period = event.period || 1;
                            const timeInPeriod = event.time_in_period || '20:00';
                            const [minutes, secs] = timeInPeriod.split(':').map(Number);
                            const timeInPeriodSeconds = minutes * 60 + (secs || 0);
                            
                            // time_in_period is TIME REMAINING in period, so convert to elapsed
                            const periodLength = period <= 3 ? 1200 : 300; // 20 min for regulation, 5 min for OT
                            const elapsedInPeriod = Math.max(0, periodLength - timeInPeriodSeconds);
                            
                            // Total game time (elapsed from game start)
                            if (period <= 3) {
                                gameTime = (period - 1) * 1200 + elapsedInPeriod;
                            } else {
                                gameTime = 3600 + (period - 4) * 300 + elapsedInPeriod;
                            }
                            
                            // Calculate probability based on score differential and time remaining
                            const scoreDiff = homeScore - awayScore;
                            const timeRemaining = (period <= 3 ? 3600 : 3900) - gameTime;
                            
                            // Use simplified calculation that matches backend logic exactly
                            let prob;
                            if (scoreDiff === 0) {
                                prob = 0.5;
                            } else {
                                // Calculate total time remaining in seconds
                                const regulationTimeTotal = 3600; // 60 minutes
                                const totalTimeRemaining = Math.max(0, timeRemaining);
                                
                                // Use the same simple logic as backend's calculate_win_probability
                                // This ensures consistency with the backend calculation
                                if (homeScore > awayScore) {
                                    // Home team is leading
                                    const leadSize = homeScore - awayScore;
                                    if (totalTimeRemaining < 300) {
                                        // Less than 5 minutes remaining
                                        prob = Math.min(0.95, 0.5 + (leadSize * 0.15));
                                    } else if (totalTimeRemaining < 600) {
                                        // Less than 10 minutes remaining
                                        prob = Math.min(0.90, 0.5 + (leadSize * 0.12));
                                    } else {
                                        // More than 10 minutes remaining
                                        prob = Math.min(0.85, 0.5 + (leadSize * 0.10));
                                    }
                                } else {
                                    // Away team is leading (home is trailing)
                                    const leadSize = awayScore - homeScore;
                                    if (totalTimeRemaining < 300) {
                                        // Less than 5 minutes remaining
                                        prob = Math.max(0.05, 0.5 - (leadSize * 0.15));
                                    } else if (totalTimeRemaining < 600) {
                                        // Less than 10 minutes remaining
                                        prob = Math.max(0.10, 0.5 - (leadSize * 0.12));
                                    } else {
                                        // More than 10 minutes remaining
                                        prob = Math.max(0.15, 0.5 - (leadSize * 0.10));
                                    }
                                }
                                
                                // Clamp to reasonable bounds
                                prob = Math.max(0.05, Math.min(0.95, prob));
                            }
                            
                            generatedPoints.push({ ts: gameTime, p_home_win: prob });
                        }
                        
                        // Merge with existing history data (prefer database data, but fill gaps with generated)
                        if (generatedPoints.length > 0) {
                            // If we have database history, use it; otherwise use generated
                            if (historyData.length > 0) {

                                const merged = [...historyData];
                                for (const genPoint of generatedPoints) {
                                    // Check if there's a database point close to this time
                                    const closePoint = historyData.find(h => Math.abs(h.ts - genPoint.ts) < 30);
                                    if (!closePoint) {

                    const remainingTotalSeconds = Math.max(0, periodLengthSeconds - elapsedTotalSeconds);

                    timeDisplay = (period <= 3) ? '20:00' : '5:00';
                }
                
                // Format period: 1st, 2nd, 3rd, OT, SO
                if (period === 1) {
                    periodDisplay = '1st';
                } else if (period === 2) {
                    periodDisplay = '2nd';
                } else if (period === 3) {
