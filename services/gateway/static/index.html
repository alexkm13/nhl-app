<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHL GameCast</title>
    <link rel="stylesheet" href="/static/styles.css?v=15">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>
    <div class="header">
        <h1>NHL Scorecast</h1>
    </div>

    <div class="date-selector" id="dateSelector">
        <!-- Dates will be populated by JavaScript -->
    </div>

    <div id="status" class="status"></div>
    <div id="loading" class="spinner" style="display: none;"></div>

    <div class="main-container">
        <div class="main-content-wrapper">
            <div class="games-column">
                <div class="section-header games">Games</div>
                <div class="games-list" id="gamesList">
                    <div class="spinner"></div>
                </div>
            </div>
            <div class="standings-column">
                <div class="section-header">Standings</div>
                <div class="standings-container" id="standingsContainer">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="game-details" id="gameDetails"></div>

    <div class="footer">
        <div class="footer-check">✓</div>
        <span>Official NHL Data</span>
    </div>

    <!-- Load JavaScript modules in dependency order -->
    <!-- Version incremented to 26: added status check before starting ingestion to avoid duplicate /start calls -->
    <script src="/static/js/config.js?v=26"></script>
    <script src="/static/js/state.js?v=26"></script>
    <script src="/static/js/utils.js?v=26"></script>
    <script src="/static/js/api.js?v=26"></script>
    <script src="/static/js/polling.js?v=26"></script>
    <script src="/static/js/ingestion.js?v=26"></script>
    <script src="/static/js/ui.js?v=26"></script>
    <script src="/static/js/dateSelector.js?v=26"></script>
    <script src="/static/js/main.js?v=26"></script>
</body>
</html>
