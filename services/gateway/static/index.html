<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHL Game Predictor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .status.info {
            background: #e3f2fd;
            color: #1976d2;
            border-left: 4px solid #1976d2;
        }

        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #2e7d32;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #c62828;
        }

        .results {
            margin-top: 30px;
            display: none;
        }

        .results.show {
            display: block;
        }

        .game-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .matchup {
            font-size: 1.5em;
            font-weight: 600;
        }

        .favorite {
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
        }

        .score {
            text-align: center;
            margin: 20px 0;
        }

        .score-display {
            font-size: 3em;
            font-weight: 700;
            margin: 10px 0;
        }

        .score-detail {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
        }

        .score-team {
            text-align: center;
        }

        .score-team .team-name {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .score-team .goals {
            font-size: 2em;
            font-weight: 700;
        }

        .situation {
            background: rgba(255,255,255,0.15);
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }

        .situation-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .situation-value {
            font-size: 1.1em;
            font-weight: 600;
        }

        .win-prob {
            background: rgba(255,255,255,0.15);
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .win-prob-title {
            font-size: 1.1em;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .win-prob-bars {
            margin-bottom: 15px;
        }

        .win-prob-bar {
            margin-bottom: 10px;
        }

        .win-prob-bar-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .win-prob-bar-fill {
            height: 24px;
            background: rgba(255,255,255,0.3);
            border-radius: 12px;
            overflow: hidden;
        }

        .win-prob-bar-progress {
            height: 100%;
            background: rgba(255,255,255,0.9);
            transition: width 0.5s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #667eea;
            font-weight: 600;
            font-size: 0.9em;
        }

        .confidence {
            text-align: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.2);
        }

        .confidence-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .confidence-value {
            font-size: 1.2em;
            font-weight: 600;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏒 NHL Game Predictor</h1>
        <p class="subtitle">Enter a game ID to view win probabilities and game statistics</p>

        <div class="input-group">
            <label for="gameId">Game ID</label>
            <input type="text" id="gameId" placeholder="e.g., 2025020161" />
        </div>

        <button id="startBtn" onclick="startIngestion()">Start Analysis</button>
        <button id="checkBtn" onclick="checkResults()" style="display: none; margin-top: 10px; background: #4caf50;">Check Results</button>

        <div id="status" class="status"></div>
        <div id="loading" class="spinner" style="display: none;"></div>

        <div id="results" class="results"></div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        async function startIngestion() {
            const gameId = document.getElementById('gameId').value.trim();
            if (!gameId) {
                showStatus('Please enter a game ID', 'error');
                return;
            }

            const startBtn = document.getElementById('startBtn');
            const checkBtn = document.getElementById('checkBtn');
            const status = document.getElementById('status');
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');

            startBtn.disabled = true;
            checkBtn.style.display = 'none';
            results.style.display = 'none';
            loading.style.display = 'block';
            showStatus('Starting ingestion...', 'info');

            try {
                const response = await fetch(`${API_BASE}/v1/games/${gameId}/start`, {
                    method: 'POST'
                });
                const data = await response.json();

                if (response.ok) {
                    showStatus(`✅ ${data.message}. Processing game data...`, 'success');
                    checkBtn.style.display = 'block';
                    // Start polling for results
                    pollForResults(gameId);
                } else {
                    showStatus(`❌ Error: ${data.detail || 'Unknown error'}`, 'error');
                    loading.style.display = 'none';
                    startBtn.disabled = false;
                }
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, 'error');
                loading.style.display = 'none';
                startBtn.disabled = false;
            }
        }

        async function checkResults() {
            const gameId = document.getElementById('gameId').value.trim();
            if (!gameId) {
                showStatus('Please enter a game ID', 'error');
                return;
            }
            await pollForResults(gameId);
        }

        async function pollForResults(gameId) {
            const loading = document.getElementById('loading');
            loading.style.display = 'block';

            // Check status first
            try {
                const statusResponse = await fetch(`${API_BASE}/v1/games/${gameId}/status`);
                const statusData = await statusResponse.json();

                if (statusData.has_prediction) {
                    // Prediction is ready, fetch it
                    await fetchResults(gameId);
                    return;
                }

                if (statusData.ingestion_status === 'in_progress') {
                    showStatus('⏳ Ingestion in progress. Waiting for results...', 'info');
                    // Poll again in 5 seconds
                    setTimeout(() => pollForResults(gameId), 5000);
                    return;
                }

                if (statusData.ingestion_status === 'failed') {
                    showStatus(`❌ Ingestion failed: ${statusData.error || 'Unknown error'}`, 'error');
                    loading.style.display = 'none';
                    document.getElementById('startBtn').disabled = false;
                    return;
                }

                // Still processing
                showStatus('⏳ Processing... Please wait', 'info');
                setTimeout(() => pollForResults(gameId), 5000);
            } catch (error) {
                showStatus(`❌ Error checking status: ${error.message}`, 'error');
                loading.style.display = 'none';
                document.getElementById('startBtn').disabled = false;
            }
        }

        async function fetchResults(gameId) {
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            const startBtn = document.getElementById('startBtn');

            try {
                const response = await fetch(`${API_BASE}/v1/games/${gameId}/winprob/friendly`);
                const data = await response.json();

                if (response.ok) {
                    displayResults(data);
                    loading.style.display = 'none';
                    startBtn.disabled = false;
                    showStatus('✅ Results loaded successfully!', 'success');
                } else if (response.status === 202) {
                    // Still processing
                    showStatus('⏳ ' + data.detail, 'info');
                    setTimeout(() => pollForResults(gameId), 5000);
                } else {
                    showStatus(`❌ ${data.detail || 'Error fetching results'}`, 'error');
                    loading.style.display = 'none';
                    startBtn.disabled = false;
                }
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, 'error');
                loading.style.display = 'none';
                startBtn.disabled = false;
            }
        }

        function displayResults(data) {
            const results = document.getElementById('results');
            const game = data.game;
            const score = data.score;
            const situation = data.current_situation;
            const winProb = data.win_probability;

            const homeTeam = score.home.team;
            const awayTeam = score.away.team;
            const homeScore = score.home.goals;
            const awayScore = score.away.goals;

            // Determine which team has higher win probability
            const homeProb = winProb[homeTeam];
            const awayProb = winProb[awayTeam];

            results.innerHTML = `
                <div class="game-card">
                    <div class="game-header">
                        <div class="matchup">${game.matchup}</div>
                        <div class="favorite">${game.favorite}</div>
                    </div>

                    <div class="score">
                        <div class="score-display">${homeScore} - ${awayScore}</div>
                        <div class="score-detail">
                            <div class="score-team">
                                <div class="team-name">${homeTeam}</div>
                                <div class="goals">${homeScore}</div>
                            </div>
                            <div class="score-team">
                                <div class="team-name">${awayTeam}</div>
                                <div class="goals">${awayScore}</div>
                            </div>
                        </div>
                    </div>

                    <div class="situation">
                        <div class="situation-label">Current Situation</div>
                        <div class="situation-value">${situation.strength}</div>
                        <div class="situation-value" style="font-size: 0.9em; margin-top: 5px; opacity: 0.9;">Last Event: ${situation.last_event}</div>
                    </div>

                    <div class="win-prob">
                        <div class="win-prob-title">Win Probability</div>
                        <div class="win-prob-bars">
                            <div class="win-prob-bar">
                                <div class="win-prob-bar-label">
                                    <span>${homeTeam}</span>
                                    <span>${homeProb}%</span>
                                </div>
                                <div class="win-prob-bar-fill">
                                    <div class="win-prob-bar-progress" style="width: ${homeProb}%">${homeProb}%</div>
                                </div>
                            </div>
                            <div class="win-prob-bar">
                                <div class="win-prob-bar-label">
                                    <span>${awayTeam}</span>
                                    <span>${awayProb}%</span>
                                </div>
                                <div class="win-prob-bar-fill">
                                    <div class="win-prob-bar-progress" style="width: ${awayProb}%">${awayProb}%</div>
                                </div>
                            </div>
                        </div>
                        <div class="confidence">
                            <div class="confidence-label">Confidence</div>
                            <div class="confidence-value">${data.confidence}</div>
                        </div>
                    </div>
                </div>
            `;

            results.style.display = 'block';
            results.classList.add('show');
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }

        // Allow Enter key to submit
        document.getElementById('gameId').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                startIngestion();
            }
        });
    </script>
</body>
</html>
