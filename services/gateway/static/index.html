<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHL GameCast</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="header">
        <h1>NHL Scorecast</h1>
    </div>

    <div class="date-selector" id="dateSelector">
        <!-- Dates will be populated by JavaScript -->
    </div>

    <div class="input-section">
        <div class="input-group">
            <div class="input-field">
                <label for="gameId">Game ID</label>
                <input type="text" id="gameId" placeholder="Enter game ID (e.g., 2025020011)" />
            </div>
            <button id="startBtn" onclick="startIngestion()">Start Analysis</button>
        </div>
        <div id="status" class="status"></div>
        <div id="loading" class="spinner" style="display: none;"></div>
    </div>

    <div class="main-container">
        <div class="section">
            <div class="section-header games">Games</div>
            <div class="games-list" id="gamesList">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <div class="game-details" id="gameDetails"></div>

    <div class="footer">
        <div class="footer-check">✓</div>
        <span>Official NHL Data</span>
    </div>

    <script>
        const API_BASE = window.location.origin || 'http://localhost:8000';

        // Initialize date selector
        function initDateSelector() {
            const dateSelector = document.getElementById('dateSelector');
            const today = new Date();
            const dates = [];
            
            for (let i = -2; i <= 2; i++) {
                const date = new Date(today);
                date.setDate(today.getDate() + i);
                dates.push(date);
            }

            dates.forEach((date, index) => {
                const dateItem = document.createElement('div');
                dateItem.className = 'date-item';
                
                const month = date.toLocaleDateString('en-US', { month: 'short' });
                const day = date.getDate();
                const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
                
                const dateTop = document.createElement('div');
                dateTop.className = 'date-top';
                dateTop.textContent = `${month} ${day}`;
                
                const dateBottom = document.createElement('div');
                dateBottom.className = 'date-bottom';
                dateBottom.textContent = dayName;
                
                dateItem.appendChild(dateTop);
                dateItem.appendChild(dateBottom);
                
                dateItem.onclick = () => {
                    document.querySelectorAll('.date-item').forEach(item => item.classList.remove('active'));
                    dateItem.classList.add('active');
                    loadGamesList(date);
                };
                
                if (index === 2) {
                    dateItem.classList.add('active');
                }
                
                dateSelector.appendChild(dateItem);
            });
        }

        // Load games list
        async function loadGamesList(date = null) {
            const gamesList = document.getElementById('gamesList');
            gamesList.innerHTML = '<div class="spinner"></div>';

            try {
                let url = `${API_BASE}/v1/games`;
                if (date) {
                    const dateStr = date.toISOString().split('T')[0];
                    url += `?date=${dateStr}`;
                }

                const response = await fetch(url);
                const data = await response.json();

                if (response.ok && data.games && data.games.length > 0) {
                    gamesList.innerHTML = data.games.map(game => {
                        const isFinal = game.game_state === 'OFF' || game.game_state === 'FINAL';
                        const homeScore = game.home_score || 0;
                        const awayScore = game.away_score || 0;
                        const homeIsWinner = homeScore > awayScore;
                        const awayIsWinner = awayScore > homeScore;
                        const isTie = homeScore === awayScore;
                        
                        // Format final status text
                        let finalStatusText = "▼ Final";
                        if (isFinal && game.overtime_type === "OT") {
                            finalStatusText = "▼ Final/OT";
                        } else if (isFinal && game.overtime_type === "SO") {
                            finalStatusText = "▼ Final/SO";
                        }
                        
                        // Determine winner/loser for final games
                        if (isFinal && !isTie) {
                            const winnerRow = homeIsWinner ?
                                `<div class="game-score-row winner">
                                    <div class="game-winner-indicator">▶</div>
                                    <img src="${game.home_team_logo || ''}" alt="${game.home_team_name}" class="game-team-logo" onerror="this.style.display='none'">
                                    <div class="game-team-name">${game.home_team_name || game.home_team}</div>
                                    <div class="game-team-score">${homeScore}</div>
                                </div>` :
                                `<div class="game-score-row winner">
                                    <div class="game-winner-indicator">▶</div>
                                    <img src="${game.away_team_logo || ''}" alt="${game.away_team_name}" class="game-team-logo" onerror="this.style.display='none'">
                                    <div class="game-team-name">${game.away_team_name || game.away_team}</div>
                                    <div class="game-team-score">${awayScore}</div>
                                </div>`;
                            
                            const loserRow = homeIsWinner ?
                                `<div class="game-score-row loser">
                                    <img src="${game.away_team_logo || ''}" alt="${game.away_team_name}" class="game-team-logo" onerror="this.style.display='none'">
                                    <div class="game-team-name">${game.away_team_name || game.away_team}</div>
                                    <div class="game-team-score">${awayScore}</div>
                                </div>` :
                                `<div class="game-score-row loser">
                                    <img src="${game.home_team_logo || ''}" alt="${game.home_team_name}" class="game-team-logo" onerror="this.style.display='none'">
                                    <div class="game-team-name">${game.home_team_name || game.home_team}</div>
                                    <div class="game-team-score">${homeScore}</div>
                                </div>`;
                            
                            return `
                                <div class="game-card" onclick="selectGame('${game.game_id}')">
                                    <div class="game-card-header">
                                        <span class="game-status-text">${finalStatusText}</span>
                                    </div>
                                    <div class="game-score-teams">
                                        ${loserRow}
                                        ${winnerRow}
                                    </div>
                                </div>
                            `;
                        } else {
                            // Live or future game - show live format
                            const isLive = game.game_state === 'LIVE' || game.game_state === 'CRIT';
                            
                            // Convert UTC time to local time
                            let gameTimeDisplay = 'TBD';
                            if (game.start_time_utc) {
                                try {
                                    const utcDate = new Date(game.start_time_utc);
                                    const localTime = utcDate.toLocaleTimeString('en-US', {
                                        hour: 'numeric',
                                        minute: '2-digit',
                                        hour12: true
                                    });
                                    gameTimeDisplay = localTime;
                                } catch (e) {
                                    gameTimeDisplay = 'TBD';
                                }
                            }
                            
                            return `
                                <div class="game-card" onclick="selectGame('${game.game_id}')">
                                    <div class="game-live-score">
                                        <div class="game-live-team-left">
                                            <img src="${game.away_team_logo || ''}" alt="${game.away_team_name}" class="game-live-logo" onerror="this.style.display='none'">
                                            <div class="game-live-score-num">${awayScore}</div>
                                            <div class="game-live-team-name">${game.away_team_name || game.away_team}</div>
                                        </div>
                                        <div class="game-live-time-container">
                                            ${isLive ? '<div class="game-live-indicator"></div>' : ''}
                                            <div class="game-live-time">${gameTimeDisplay}</div>
                                            ${game.spread !== null && game.spread !== undefined ? 
                                                `<div class="game-spread">${game.spread_favorite === 'home' ? game.home_team_name : game.away_team_name} ${game.spread > 0 ? '+' : ''}${game.spread}</div>` : 
                                                '<div class="game-spread">N/A</div>'}
                                        </div>
                                        <div class="game-live-team-right">
                                            <img src="${game.home_team_logo || ''}" alt="${game.home_team_name}" class="game-live-logo" onerror="this.style.display='none'">
                                            <div class="game-live-score-num">${homeScore}</div>
                                            <div class="game-live-team-name">${game.home_team_name || game.home_team}</div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }
                    }).join('');
                } else {
                    gamesList.innerHTML = '<div style="color: #aaaaaa; padding: 20px; text-align: center;">No games scheduled for this date</div>';
                }
            } catch (error) {
                console.error('Error loading games:', error);
                gamesList.innerHTML = '<div style="color: #ee8888; padding: 20px; text-align: center;">Error loading games</div>';
            }
        }

        function selectGame(gameId) {
            document.getElementById('gameId').value = gameId;
            startIngestion();
        }

        async function startIngestion() {
            const gameId = document.getElementById('gameId').value.trim();
            if (!gameId) {
                showStatus('Please enter a game ID', 'error');
                return;
            }

            const startBtn = document.getElementById('startBtn');
            const status = document.getElementById('status');
            const loading = document.getElementById('loading');
            const gameDetails = document.getElementById('gameDetails');

            startBtn.disabled = true;
            gameDetails.style.display = 'none';
            loading.style.display = 'block';
            showStatus('Starting ingestion...', 'info');

            try {
                const response = await fetch(`${API_BASE}/v1/games/${gameId}/start`, {
                    method: 'POST'
                });
                const data = await response.json();

                if (response.ok) {
                    showStatus(`${data.message}. Processing game data...`, 'success');
                    pollForResults(gameId);
                } else {
                    showStatus(`Error: ${data.detail || 'Unknown error'}`, 'error');
                    loading.style.display = 'none';
                    startBtn.disabled = false;
                }
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
                loading.style.display = 'none';
                startBtn.disabled = false;
            }
        }

        async function pollForResults(gameId) {
            const loading = document.getElementById('loading');
            loading.style.display = 'block';

            try {
                const statusResponse = await fetch(`${API_BASE}/v1/games/${gameId}/status`);
                
                if (!statusResponse.ok) {
                    throw new Error(`HTTP ${statusResponse.status}: ${statusResponse.statusText}`);
                }
                
                let statusData;
                try {
                    statusData = await statusResponse.json();
                } catch (jsonError) {
                    const text = await statusResponse.text();
                    throw new Error(`Invalid JSON response: ${text.substring(0, 100)}`);
                }

                if (statusData.has_prediction) {
                    await fetchResults(gameId);
                    return;
                }

                if (statusData.ingestion_status === 'in_progress') {
                    showStatus('Ingestion in progress. Waiting for results...', 'info');
                    setTimeout(() => pollForResults(gameId), 5000);
                    return;
                }

                if (statusData.ingestion_status === 'failed') {
                    showStatus(`Ingestion failed: ${statusData.error || 'Unknown error'}`, 'error');
                    loading.style.display = 'none';
                    document.getElementById('startBtn').disabled = false;
                    return;
                }

                showStatus('Processing... Please wait', 'info');
                setTimeout(() => pollForResults(gameId), 5000);
            } catch (error) {
                console.error('Status check error:', error);
                const errorMsg = error.message || 'Network error';
                showStatus(`Error checking status: ${errorMsg}`, 'error');
                loading.style.display = 'none';
                document.getElementById('startBtn').disabled = false;
            }
        }

        async function fetchResults(gameId) {
            const loading = document.getElementById('loading');
            const gameDetails = document.getElementById('gameDetails');
            const startBtn = document.getElementById('startBtn');

            try {
                const response = await fetch(`${API_BASE}/v1/games/${gameId}/winprob/friendly`);
                const data = await response.json();

                if (response.ok) {
                    displayResults(data);
                    loading.style.display = 'none';
                    startBtn.disabled = false;
                    showStatus('Results loaded successfully!', 'success');
                } else if (response.status === 202) {
                    showStatus(data.detail, 'info');
                    setTimeout(() => pollForResults(gameId), 5000);
                } else {
                    showStatus(`${data.detail || 'Error fetching results'}`, 'error');
                    loading.style.display = 'none';
                    startBtn.disabled = false;
                }
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
                loading.style.display = 'none';
                startBtn.disabled = false;
            }
        }

        async function displayResults(data) {
            const gameDetails = document.getElementById('gameDetails');
            const game = data.game;
            const score = data.score;
            const situation = data.current_situation;
            const winProb = data.win_probability;

            const homeTeam = score.home.team;
            const awayTeam = score.away.team;
            const homeScore = score.home.goals;
            const awayScore = score.away.goals;

            const homeProb = winProb[homeTeam];
            const awayProb = winProb[awayTeam];

            const gameId = data.game.id;
            
            // Fetch historical win probability data for graphing
            let historyData = [];
            try {
                const historyResponse = await fetch(`${API_BASE}/v1/games/${gameId}/winprob/history`);
                if (historyResponse.ok) {
                    const historyResult = await historyResponse.json();
                    historyData = historyResult.data || [];
                }
            } catch (error) {
                console.error('Error fetching win probability history:', error);
            }
            
            // Check if game is final
            let isFinal = false;
            let finalData = null;
            try {
                const finalResponse = await fetch(`${API_BASE}/v1/games/${gameId}/final`);
                if (finalResponse.ok) {
                    finalData = await finalResponse.json();
                    isFinal = finalData.is_final;
                }
            } catch (error) {
                console.error('Error checking final score:', error);
            }
            
            // Get overtime type from finalData if available (for accurate OT/SO display)
            const overtimeType = finalData?.overtime_type || null;
            
            // If game is final, show final score display
            if (isFinal && finalData) {
                const finalHomeTeam = finalData.home_team;
                const finalAwayTeam = finalData.away_team;
                const finalHomeScore = finalData.home_score;
                const finalAwayScore = finalData.away_score;
                const winner = finalData.winner;
                
                // Determine winner and loser
                const homeIsWinner = winner === "HOME";
                const awayIsWinner = winner === "AWAY";
                const isTie = winner === "TIE";
                
                const finalHomeLogo = finalData.home_logo || '';
                const finalAwayLogo = finalData.away_logo || '';
                
                // Order: loser first (top), winner second (bottom) with triangle
                const winnerRow = homeIsWinner ? 
                    `<div class="final-team-row winner">
                        <div class="final-winner-indicator">▶</div>
                        <img src="${finalHomeLogo}" alt="${finalHomeTeam}" class="final-team-logo" onerror="this.style.display='none'">
                        <div class="final-team-name">${finalHomeTeam}</div>
                        <div class="final-team-score">${finalHomeScore}</div>
                    </div>` :
                    `<div class="final-team-row winner">
                        <div class="final-winner-indicator">▶</div>
                        <img src="${finalAwayLogo}" alt="${finalAwayTeam}" class="final-team-logo" onerror="this.style.display='none'">
                        <div class="final-team-name">${finalAwayTeam}</div>
                        <div class="final-team-score">${finalAwayScore}</div>
                    </div>`;
                
                const loserRow = homeIsWinner ?
                    `<div class="final-team-row loser">
                        <img src="${finalAwayLogo}" alt="${finalAwayTeam}" class="final-team-logo" onerror="this.style.display='none'">
                        <div class="final-team-name">${finalAwayTeam}</div>
                        <div class="final-team-score">${finalAwayScore}</div>
                    </div>` :
                    `<div class="final-team-row loser">
                        <img src="${finalHomeLogo}" alt="${finalHomeTeam}" class="final-team-logo" onerror="this.style.display='none'">
                        <div class="final-team-name">${finalHomeTeam}</div>
                        <div class="final-team-score">${finalHomeScore}</div>
                    </div>`;
                
                // Format final status text
                let finalStatusText = "▼ Final";
                if (finalData.overtime_type === "OT") {
                    finalStatusText = "▼ Final/OT";
                } else if (finalData.overtime_type === "SO") {
                    finalStatusText = "▼ Final/SO";
                }
                
                gameDetails.innerHTML = `
                    <div class="final-score-container">
                        <div class="final-score-header">
                            <span class="final-status">${finalStatusText}</span>
                        </div>
                        <div class="final-score-teams">
                            ${loserRow}
                            ${winnerRow}
                        </div>
                    </div>

                    <div class="win-prob">
                        <div class="win-prob-title">Win Probability</div>
                        ${generateWinProbGraph(historyData, homeTeam, awayTeam, homeProb, awayProb, false, finalHomeLogo, finalAwayLogo, finalData.home_abbrev || '', finalData.away_abbrev || '')}
                    </div>

                    <div id="playbyplay-feed" class="playbyplay-feed">
                        <div class="spinner"></div>
                    </div>
                `;
                
                loadPlayByPlay(gameId, homeTeam, awayTeam);
                gameDetails.style.display = 'block';
                gameDetails.classList.add('show');
                gameDetails.scrollIntoView({ behavior: 'smooth' });
                return;
            }
            
            const homeLogo = score.home.logo || '';
            const awayLogo = score.away.logo || '';
            const isLive = game.is_live || false;
            const period = game.period || 1;
            const timeInPeriod = game.time_in_period || '00:00';
            
            // Format time: convert MM:SS to minutes (e.g., "19:46" -> "19'")
            let timeDisplay = '';
            if (timeInPeriod) {
                const [minutes, seconds] = timeInPeriod.split(':');
                timeDisplay = `${minutes}'`;
            } else {
                timeDisplay = `P${period}`;
            }
            
            // Format spread
            let spreadDisplay = 'N/A';
            if (game.spread !== null && game.spread !== undefined) {
                const favoriteTeam = game.spread_favorite === 'home' ? homeTeam : awayTeam;
                const spreadSign = game.spread > 0 ? '+' : '';
                spreadDisplay = `${favoriteTeam} ${spreadSign}${game.spread}`;
            }
            
            gameDetails.innerHTML = `
                <div class="live-score-container">
                    <div class="live-team-left">
                        <img src="${awayLogo}" alt="${awayTeam}" class="live-team-logo" onerror="this.style.display='none'">
                        <div class="live-team-score">${awayScore}</div>
                        <div class="live-team-name">${awayTeam}</div>
                    </div>
                    <div class="live-time-container">
                        ${isLive ? '<div class="live-indicator"></div>' : ''}
                        <div class="live-time">${timeDisplay}</div>
                        <div class="game-spread">${spreadDisplay}</div>
                    </div>
                    <div class="live-team-right">
                        <img src="${homeLogo}" alt="${homeTeam}" class="live-team-logo" onerror="this.style.display='none'">
                        <div class="live-team-score">${homeScore}</div>
                        <div class="live-team-name">${homeTeam}</div>
                    </div>
                </div>

                <div class="win-prob">
                    <div class="win-prob-title">Win Probability</div>
                    ${generateWinProbGraph(historyData, homeTeam, awayTeam, homeProb, awayProb, isLive, homeLogo, awayLogo, score.home.abbrev || '', score.away.abbrev || '')}
                </div>

                <div id="playbyplay-feed" class="playbyplay-feed">
                    <div class="spinner"></div>
                </div>
            `;
            
            loadPlayByPlay(gameId, homeTeam, awayTeam);
            gameDetails.style.display = 'block';
            gameDetails.classList.add('show');
            gameDetails.scrollIntoView({ behavior: 'smooth' });
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }

        function generateWinProbGraph(historyData, homeTeam, awayTeam, homeProb, awayProb, isLive, homeLogo = '', awayLogo = '', homeAbbrev = '', awayAbbrev = '') {
            // Determine graph dimensions
            const width = 600;
            const height = 200;
            const padding = { top: 20, right: 20, bottom: 30, left: 40 };
            const chartWidth = width - padding.left - padding.right;
            const chartHeight = height - padding.top - padding.bottom;
            
            let points = [];
            let minTime, maxTime, timeRange;
            
            // If no historical data, create a single point at current probability
            if (!historyData || historyData.length === 0) {
                // Create a simple horizontal line at current probability
                const currentProb = homeProb / 100;
                const x1 = padding.left;
                const x2 = width - padding.right;
                const y = padding.top + chartHeight - (currentProb * chartHeight);
                points = [
                    { x: x1, y: y },
                    { x: x2, y: y }
                ];
                minTime = 0;
                maxTime = 3600; // Assume 60 minutes for a full game
                timeRange = maxTime - minTime;
            } else {
                // Calculate time range from historical data
                const times = historyData.map(d => d.ts);
                minTime = Math.min(...times);
                maxTime = Math.max(...times);
                timeRange = maxTime - minTime || 1;
                
                // Map data points to SVG coordinates
                points = historyData.map((d, i) => {
                    const x = padding.left + (d.ts - minTime) / timeRange * chartWidth;
                    const y = padding.top + chartHeight - (d.p_home_win * chartHeight);
                    return { x, y };
                });
                
                // Add current point if it's not already in the data
                const lastPoint = points[points.length - 1];
                if (!lastPoint || Math.abs(lastPoint.x - (width - padding.right)) > 10) {
                    const currentProb = homeProb / 100;
                    const currentX = width - padding.right;
                    const currentY = padding.top + chartHeight - (currentProb * chartHeight);
                    points.push({ x: currentX, y: currentY });
                }
            }
            
            // Build SVG path
            let path = '';
            if (points.length > 0) {
                path = `M ${points[0].x} ${points[0].y}`;
                for (let i = 1; i < points.length; i++) {
                    path += ` L ${points[i].x} ${points[i].y}`;
                }
            }
            
            // Create area above line for away team probability (inverse of home team)
            // The area should fill from the line up to the top
            let areaPath = '';
            if (points.length > 0) {
                areaPath = `M ${points[0].x} ${padding.top}`;
                for (let i = 0; i < points.length; i++) {
                    areaPath += ` L ${points[i].x} ${points[i].y}`;
                }
                areaPath += ` L ${points[points.length - 1].x} ${padding.top} Z`;
            }
            
            // Determine period markers
            const periods = [];
            if (timeRange > 0 && timeRange < 4000) {  // Typical NHL game is ~3600 seconds
                // Mark periods at 1/3, 2/3, and end (roughly)
                periods.push({ x: padding.left + chartWidth / 3, label: '1st' });
                periods.push({ x: padding.left + chartWidth * 2 / 3, label: '2nd' });
                periods.push({ x: padding.left + chartWidth, label: '3rd' });
            } else if (timeRange === 0 || !historyData || historyData.length === 0) {
                // For games without history, show period markers at even intervals
                periods.push({ x: padding.left + chartWidth / 3, label: '1st' });
                periods.push({ x: padding.left + chartWidth * 2 / 3, label: '2nd' });
                periods.push({ x: padding.left + chartWidth, label: '3rd' });
            }
            
            // Use provided abbreviations, or fall back to first 3 letters if not provided
            const homeAbbrevDisplay = homeAbbrev || homeTeam.substring(0, 3).toUpperCase();
            const awayAbbrevDisplay = awayAbbrev || awayTeam.substring(0, 3).toUpperCase();
            
            // Get the last point for the circle
            const lastPoint = points[points.length - 1];
            
            return `
                <div class="win-prob-graph-container">
                    <div class="win-prob-graph-labels">
                        <div class="win-prob-graph-team-left">
                            ${homeLogo ? `<img src="${homeLogo}" alt="${homeTeam}" class="win-prob-graph-logo" onerror="this.style.display='none'">` : ''}
                            <span class="win-prob-graph-percentage">${homeProb.toFixed(1)}%</span>
                            <span class="win-prob-graph-abbrev">-- ${homeAbbrevDisplay}</span>
                        </div>
                        <div class="win-prob-graph-team-right">
                            <span class="win-prob-graph-abbrev">${awayAbbrevDisplay} --</span>
                            <span class="win-prob-graph-percentage">${awayProb.toFixed(1)}%</span>
                            ${awayLogo ? `<img src="${awayLogo}" alt="${awayTeam}" class="win-prob-graph-logo" onerror="this.style.display='none'">` : ''}
                        </div>
                    </div>
                    <svg class="win-prob-graph" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
                        <!-- Y-axis labels -->
                        <text x="${padding.left - 10}" y="${padding.top + 5}" text-anchor="end" font-size="10" fill="#888">100</text>
                        <text x="${padding.left - 10}" y="${padding.top + chartHeight / 2 + 5}" text-anchor="end" font-size="10" fill="#888">50</text>
                        <text x="${padding.left - 10}" y="${height - padding.bottom + 5}" text-anchor="end" font-size="10" fill="#888">100</text>
                        
                        <!-- Grid lines -->
                        <line x1="${padding.left}" y1="${padding.top}" x2="${padding.left}" y2="${height - padding.bottom}" stroke="#333" stroke-width="1"/>
                        <line x1="${padding.left}" y1="${height - padding.bottom}" x2="${width - padding.right}" y2="${height - padding.bottom}" stroke="#333" stroke-width="1"/>
                        <line x1="${padding.left}" y1="${padding.top + chartHeight / 2}" x2="${width - padding.right}" y2="${padding.top + chartHeight / 2}" stroke="#333" stroke-width="1" stroke-dasharray="2,2"/>
                        
                        <!-- Shaded area above line for away team probability -->
                        <path d="${areaPath}" fill="#444" opacity="0.4"/>
                        
                        <!-- Black line for home team probability -->
                        <path d="${path}" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        
                        <!-- Large circle at the end of the line -->
                        ${lastPoint ? `<circle cx="${lastPoint.x}" cy="${lastPoint.y}" r="6" fill="#000000" stroke="#000000" stroke-width="2"/>` : ''}
                        
                        <!-- Period markers -->
                        ${periods.map(p => `
                            <line x1="${p.x}" y1="${padding.top}" x2="${p.x}" y2="${height - padding.bottom}" stroke="#333" stroke-width="0.5" stroke-dasharray="2,2"/>
                            <text x="${p.x}" y="${height - 10}" text-anchor="middle" font-size="10" fill="#888">${p.label}</text>
                        `).join('')}
                    </svg>
                </div>
            `;
        }
        
        function switchTab(tabName, gameId) {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            event.target.classList.add('active');
            document.getElementById(`${tabName}-tab`).classList.add('active');

            if (tabName === 'playbyplay') {
                const feed = document.getElementById('playbyplay-feed');
                if (feed && (!feed.innerHTML.trim() || feed.innerHTML.includes('spinner'))) {
                    loadPlayByPlay(gameId);
                }
            }
        }

        async function loadPlayByPlay(gameId, homeTeam, awayTeam) {
            const feed = document.getElementById('playbyplay-feed');
            if (!feed) return;

            feed.innerHTML = '<div class="spinner"></div>';

            try {
                const response = await fetch(`${API_BASE}/v1/games/${gameId}/playbyplay?limit=50`);
                const data = await response.json();

                if (response.ok && data.events) {
                    if (data.events.length === 0) {
                        feed.innerHTML = '<div style="color: #aaaaaa; text-align: center; padding: 40px;">No events yet. Start ingestion to see play-by-play.</div>';
                        return;
                    }

                    const mostRecentTime = data.events[0]?.timestamp || Date.now() / 1000;

                    feed.innerHTML = data.events.map((event, index) => {
                        const timeAgo = Math.round((mostRecentTime - event.timestamp) / 60);
                        const timeStr = timeAgo === 0 ? 'Just now' : `${timeAgo}m ago`;
                        const playerInitials = event.player ? event.player.split(' ').map(n => n[0]).join('').substring(0, 2) : '?';
                        const strengthClass = event.strength || 'EV';
                        
                        // Format period and time
                        const period = event.period || 1;
                        const timeInPeriod = event.time_in_period || '00:00';
                        const periodTime = `P${period} ${timeInPeriod}`;
                        
                        return `
                            <div class="playbyplay-event">
                                <div class="event-player-avatar">${playerInitials}</div>
                                <div class="event-content">
                                    <div class="event-header">
                                        <span>${event.home_score} - ${event.away_score}</span>
                                        <span>${periodTime}</span>
                                    </div>
                                    <div class="event-description">
                                        ${event.description}
                                    </div>
                                    <div class="event-player">
                                        ${event.player || 'Unknown Player'}
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    feed.innerHTML = '<div style="color: #aaaaaa; text-align: center; padding: 40px;">Error loading play-by-play.</div>';
                }
            } catch (error) {
                feed.innerHTML = `<div style="color: #ee8888; text-align: center; padding: 40px;">Error: ${error.message}</div>`;
            }
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', async function() {
            initDateSelector();
            await loadGamesList();
        });

        // Allow Enter key to submit
        document.getElementById('gameId').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                startIngestion();
            }
        });
    </script>
</body>
</html>
