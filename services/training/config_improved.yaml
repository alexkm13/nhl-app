# Improved Training Configuration
training:
  # Data configuration - Use more recent data
  train_start_date: "2024-10-01"
  train_end_date: "2025-03-31"  # Regular season through March
  test_start_date: "2025-04-01"
  test_end_date: "2025-10-01"  # Playoffs and start of next season
  
  # Feature engineering
  features:
    include_score_features: true
    include_time_features: true
    include_strength_features: true
    include_momentum_features: true
    include_stat_features: false
    include_recent_events: true
  
  # Model configuration
  model:
    model_type: lightgbm  # Use LightGBM for better performance
    
    # Improved hyperparameters
    hyperparameters:
      # Learning parameters
      learning_rate: 0.03  # Lower learning rate for better convergence
      num_iterations: 300  # More iterations
      early_stopping_rounds: 25
      
      # Tree structure
      num_leaves: 40  # More leaves for better fit
      max_depth: 8  # Deeper trees
      min_data_in_leaf: 20  # Prevent overfitting
      
      # Regularization
      reg_alpha: 0.1  # L1 regularization
      reg_lambda: 1.0  # L2 regularization
      min_gain_to_split: 0.02  # Minimum gain to split
      
      # Sampling
      feature_fraction: 0.85  # Feature sampling
      bagging_fraction: 0.85  # Data sampling
      bagging_freq: 5  # Bagging frequency
      
      # Calibration
      scale_pos_weight: 1.0  # Will be calculated from data
      
      # Other
      random_seed: 42
      verbosity: -1
      force_row_wise: true
  
  # Training configuration
  validation_split: 0.2
  random_seed: 42
  
  # Evaluation
  metrics:
    - log_loss
    - brier_score
    - roc_auc
    - accuracy
    - calibration_error
  
  # Logging
  log_level: INFO

