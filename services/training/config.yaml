# Training Configuration
training:
  # Data configuration - 2024-25 NHL season
  train_start_date: "2024-10-01"
  train_end_date: "2025-03-31"  # Regular season through March
  test_start_date: "2025-04-01"
  test_end_date: "2025-10-01"  # Playoffs and start of next season
  
  # Feature engineering
  features:
    include_score_features: true
    include_time_features: true
    include_strength_features: true
    include_momentum_features: true
    include_stat_features: true  # shots, hits, faceoffs, etc.
    include_recent_events: true
    window_size_seconds: 300  # 5 minutes for rolling stats
  
  # Model configuration
  model_type: "lightgbm"  # xgboost, lightgbm, catboost (using lightgbm for compatibility)
  random_seed: 42
  
  # Hyperparameters
  hyperparameters:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 3
    reg_alpha: 0.1
    reg_lambda: 1.0
  
  # Training parameters
  validation_split: 0.2
  early_stopping_rounds: 20
  cv_folds: 5
  
  # Evaluation
  metrics:
    - "log_loss"
    - "brier_score"
    - "roc_auc"
    - "calibration_error"
    - "accuracy"
  
  # Model registry
  registry:
    save_model: true
    model_format: "pickle"  # pickle, joblib, onnx
    experiment_tracking: true
    tracking_backend: "mlflow"  # mlflow, wandb, local

